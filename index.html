<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Pretty Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF7F4; --card:#FFFFFF; --ink:#423630; --muted:#7A675E; --pink:#855C50; --pink2:#B98F83;
  --soft:#F5E9E5; --beige:#EADDD5; --line:#E8DFD9; --field:#FAF7F4; --on:#FFFFFF; --ok:#6F9A7D;
  --shadow:0 2px 12px #42363012; --wm-op:.05;
  --low:#EADDD5; --mod:#F1E2C6; --high:#E6BFB3;
}
:root[data-theme="dark"]{
  --bg:#211B18; --card:#2B2420; --ink:#F1E7E1; --muted:#BDAAA0; --pink:#D9B0A3; --pink2:#B98F83;
  --soft:#352B26; --beige:#41352F; --line:#4A3F38; --field:#241E1B; --on:#241C18; --ok:#8DBF9E;
  --shadow:0 2px 12px #0006; --wm-op:.06;
  --low:#4A3D38; --mod:#5B4A33; --high:#6A4540;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Quicksand,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;position:relative}
body::before{content:"";position:fixed;inset:0;background-image:var(--wm);background-size:300px 300px;opacity:var(--wm-op);pointer-events:none;z-index:0}
#app{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:16px}
h1,h2,h3{font-family:Pacifico,cursive;font-weight:400;color:var(--pink);margin:.2em 0}
header.top{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;position:sticky;top:0;z-index:6;background:var(--bg);padding:10px 0;margin-bottom:8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px}
header .logo{width:44px;height:44px}
header h1{font-size:1.45rem;margin:0;white-space:nowrap}
.top-actions{display:flex;align-items:center;gap:10px;margin-left:auto}
.avatar-btn{width:44px;height:44px;padding:0;border-radius:50%;overflow:hidden;background:var(--soft);color:var(--pink);border:2px solid var(--pink2);box-shadow:none;display:grid;place-items:center;font-size:1.1rem}
.avatar-btn img{width:100%;height:100%;object-fit:cover;display:block}
.avatar-btn.on{outline:2px solid var(--pink);outline-offset:2px}
.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;border:3px solid var(--pink);background:var(--soft)}
button,select,input,textarea{font:inherit;color:var(--ink)}
button{cursor:pointer;border:0;border-radius:999px;padding:8px 16px;background:var(--pink);color:var(--on);font-weight:700;box-shadow:var(--shadow)}
button.ghost{background:var(--soft);color:var(--pink);box-shadow:none;border:1px solid var(--line)}
button.small{padding:3px 10px;font-size:.85rem}
button.x{background:transparent;color:var(--muted);box-shadow:none;padding:2px 8px}
nav{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
nav button{background:var(--card);color:var(--pink);box-shadow:none;border:1px solid var(--line)}
nav button.on{background:var(--pink);color:var(--on)}
.quote{background:var(--soft);color:var(--pink);border:1px solid var(--line);border-radius:18px;padding:12px 18px;font-weight:600;text-align:center;box-shadow:none;margin:8px 0 14px}
.quote.mini{background:transparent;color:var(--muted);box-shadow:none;border:1px dashed var(--line);margin-top:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
label{display:block;font-size:.8rem;color:var(--muted);font-weight:700}
input,select,textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:7px 10px;margin-top:3px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--pink);margin:0}
textarea{min-height:60px;resize:vertical}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.tabs button{background:var(--card);color:var(--pink);box-shadow:none;border:1px solid var(--line);padding:5px 12px}
.tabs button.on{background:var(--pink);color:var(--on)}
.tabs .lbl{font-weight:700;color:var(--muted);font-size:.85rem}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{color:var(--muted);font-size:.72rem;text-transform:uppercase;text-align:left;padding:4px}
td{padding:3px}
td input{margin:0;padding:5px 6px;min-width:46px}
td.name input{min-width:110px}
tfoot td{font-weight:700;color:var(--pink);padding:6px 4px}
.scroll{overflow-x:auto}
.meal{border:1px solid var(--line);border-radius:18px;padding:12px;margin:10px 0;background:var(--card)}
.meal.done{border-color:var(--ok);box-shadow:0 0 0 2px #6F9A7D33}
.meal-h{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.meal-h input[type=text]{font-weight:700;font-size:1.05rem}
.bar{height:12px;background:var(--beige);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--pink2);border-radius:99px;transition:width .3s}
.bar.ok i{background:var(--ok)}
.stat{text-align:center}
.stat b{display:block;font-size:1.7rem;color:var(--pink)}
.stat span{font-size:.8rem;color:var(--muted);font-weight:700}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;background:var(--soft);color:var(--pink);border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:.78rem;font-weight:700}
.prog-row{display:grid;grid-template-columns:110px 1fr 1fr 80px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:.85rem}
.prog-row small{color:var(--muted)}
.vid{display:grid;grid-template-columns:1fr 1fr 130px 1fr auto;gap:8px;align-items:end;padding:8px 0;border-bottom:1px dashed var(--line)}
.profile-top{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.big-avatar{width:130px;height:130px;border-radius:50%;object-fit:cover;border:4px solid var(--pink);background:var(--soft)}
.macro{margin:6px 0}
.macro .row{justify-content:space-between;font-size:.85rem;font-weight:600}
table.ro td,table.ro th{padding:5px 6px;white-space:nowrap}
table.ro td:first-child{white-space:normal;min-width:130px}
table.ro thead th{background:var(--beige);color:var(--ink);font-weight:700;letter-spacing:.04em}
table.ro tbody tr:nth-child(even){background:var(--soft)}
table.ro tfoot td{background:var(--beige);color:var(--ink);font-weight:700;border-top:1px solid var(--line)}
tr.ref td{color:var(--muted);font-size:.8rem}
.na{color:var(--muted);font-style:italic;font-size:.8rem}
.note{font-size:.8rem;color:var(--muted);margin:6px 0 0}
.pill.ok{background:#6F9A7D22;color:var(--ok);border-color:var(--ok)}
.carb-low{background:var(--low)}.carb-moderate{background:var(--mod)}.carb-high{background:var(--high)}
.pill.carb-low,.pill.carb-moderate,.pill.carb-high{color:var(--ink);border-color:var(--line)}
.mini4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:.7rem;color:var(--muted)}
.mini4 .bar{height:8px}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:10px 0}
.mcell{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:none;font-weight:600}
.mcell b{font-size:.85rem}.mcell small,.mcell em{font-size:.7rem;font-style:normal;color:var(--muted)}
.mcell i{display:block;width:70%;height:5px;border-radius:9px}
.mcell.full{border-color:var(--ok);background:#6F9A7D26}.mcell.part{border-color:var(--pink)}.mcell.today{outline:2px solid var(--pink2);outline-offset:1px}
.legend{display:inline-block;width:10px;height:10px;border-radius:3px;border:2px solid var(--line);vertical-align:middle}.legend.full{border-color:var(--ok)}.legend.part{border-color:var(--pink)}
.dash-day{grid-template-columns:110px 1fr 1.3fr 80px}
.ex{border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;background:var(--card)}
.ex.done{border-color:var(--ok);box-shadow:0 0 0 2px #6F9A7D33}
.wsum{grid-template-columns:150px 1fr 1fr 10px}
.ex a,label a{font-size:.8rem;color:var(--pink);font-weight:600}
@media(max-width:1000px){ header h1{display:none} nav{flex-wrap:nowrap;overflow-x:auto} nav button{white-space:nowrap;padding:6px 10px;font-size:.9rem} }
@media(max-width:700px){
  .wsum{grid-template-columns:1fr 1fr}
  .dash-day{grid-template-columns:1fr 1fr}.mini4{grid-column:1/-1}.month{gap:4px}.mcell{padding:4px 0}
  .prog-row{grid-template-columns:1fr 1fr}
  .vid{grid-template-columns:1fr}
  header h1{font-size:1.2rem}
  nav{order:3;flex:1 0 100%;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
  nav button{white-space:nowrap}
}
</style>
</head>
<body>
<div id="app"></div>

<script src="data/plan-data.js"></script>
<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const clone = o => JSON.parse(JSON.stringify(o));
const r1 = n => Math.round((+n||0)*10)/10;
const num = s => { const m = String(s ?? '').match(/[\d.]+/g); return m ? parseFloat(m[m.length-1]) : 0; };

const QUOTES = [
  "You are stronger than you think, gorgeous 💖","Small steps every day become big changes 🌸","Progress, not perfection 🐾",
  "Be proud of every healthy choice you make ✨","Purr-severance is the key 😺","Your only competition is who you were yesterday 🎀",
  "Strong is the new pretty 💪","Treat your body like it's the home of your dreams 🏡","One more rep, one more purr-fect day 🐱",
  "Discipline is self-love 💗","You didn't come this far to only come this far 🌷","Glow from the inside out ✨",
  "Fall in love with taking care of yourself 💕","Sweat now, sparkle later 💎","Feed your body, fuel your dreams 🍓"
];
const quote = (mini) => `<div class="quote ${mini?'mini':''}">${QUOTES[Math.floor(Math.random()*QUOTES.length)]}</div>`;

const CAT = c => `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'>
<g fill='none' stroke='${c}' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' transform='translate(48 50) scale(.5)'>
<path d='M30 60 L38 12 L72 40 Q90 34 108 40 L142 12 L150 60 Q158 90 140 112 Q120 132 90 132 Q60 132 40 112 Q22 90 30 60Z'/>
<circle cx='66' cy='78' r='6' fill='${c}'/><circle cx='114' cy='78' r='6' fill='${c}'/>
<path d='M84 94 L96 94 L90 102Z' fill='${c}'/><path d='M90 102 Q84 112 76 108 M90 102 Q96 112 104 108'/>
<path d='M52 94 L18 88 M52 102 L18 106 M128 94 L162 88 M128 102 L162 106'/></g>
</svg>`;
const LOGO = CAT('#B98F83').replace('viewBox=\'0 0 180 180\'','viewBox=\'0 0 180 180\' class=\'logo\'');
document.documentElement.style.setProperty('--wm', `url("data:image/svg+xml,${encodeURIComponent(CAT('#B98F83'))}")`);

/* ---------- state ---------- */
const KEY = 'prettyplan.v1';
const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const INTENS = ['Low','Moderate','High'];
const newEx = () => ({name:'',min:0,kcal:0,int:'Moderate',video:'',url:'',notes:'',done:false});

const LEGS_DAYS=['Monday','Wednesday','Friday'];
function seedWorkDay(weekday){ // sample plan: rest on Sunday, legs Mon/Wed/Fri, abs Tue/Thu/Sat
  if(weekday==='Sunday') return {name:weekday,notes:'Rest day 🌸 stretch & relax',exercises:[]};
  const ex=(name,min,kcal,int)=>({name,min,kcal,int,video:'',url:'',notes:'',done:false});
  const base=[ex('Treadmill',30,250,'Moderate')];
  base.push(LEGS_DAYS.includes(weekday)?ex('Glutes & legs',25,180,'High'):ex('Abs & core',15,90,'Moderate'));
  return {name:weekday,notes:'',exercises:base};
}
function seed(){
  return {
    theme:'light',
    ui:{tab:'dashboard',nw:0,nd:0,ww:0,wd:0,dashWeek:'all',vidFilter:'all'},
    profile:{name:'',weight:'',height:'',gender:'Female',birthday:'',photo:''},
    nutriDone:{}, planStart:'', nutritionPlanVersion:PLAN.version,
    workouts:{weeks:Array.from({length:4},(_,w)=>({days:DAYS.map((_,i)=>seedWorkDay(PLAN_DAYS[w*7+i].weekday))}))}, workoutsAligned:true,
    videos:[
      {name:'20 min HIIT fat burn',url:'https://www.youtube.com/results?search_query=20+min+hiit+workout',type:'HIIT',notes:''},
      {name:'Glute workout at home',url:'https://www.youtube.com/results?search_query=glute+workout+at+home',type:'Muscles',notes:''},
    ]
  };
}
const PLAN = window.NUTRITION_PLAN;
const PLAN_DAYS = PLAN.weeks.flatMap(w=>w.days);
const ENTRY_IDS = new Set(PLAN_DAYS.flatMap(d=>[...d.meals,d.coffee].map(e=>e.id)));
const NUT = [{k:'kcal',label:'Calories',short:'kcal',unit:'kcal'},{k:'p',label:'Protein',short:'P',unit:'g'},{k:'c',label:'Carbohydrates',short:'C',unit:'g'},{k:'f',label:'Fats',short:'F',unit:'g'},{k:'fiber',label:'Fiber',short:'Fi',unit:'g'}];
function migrate(o){
  const b = seed();
  if(o.nutrition){ // old sample nutrition data is replaced by the PDF plan (kept once as a backup key)
    try{ if(!localStorage.getItem(KEY+'.old-sample-nutrition')) localStorage.setItem(KEY+'.old-sample-nutrition', JSON.stringify(o.nutrition)); }catch(e){}
    delete o.nutrition;
  }
  for(const k of ['theme','profile','workouts','videos']) if(o[k]===undefined) o[k]=b[k];
  o.ui = Object.assign({}, b.ui, o.ui);
  o.ui.nw = Math.min(3, Math.max(0, +o.ui.nw||0)); o.ui.nd = Math.min(6, Math.max(0, +o.ui.nd||0));
  if(!['dashboard','nutrition','workouts','videos','profile'].includes(o.ui.tab)) o.ui.tab='dashboard';
  o.nutriDone = (o.nutriDone && typeof o.nutriDone==='object') ? o.nutriDone : {};
  Object.keys(o.nutriDone).forEach(k=>{ if(!ENTRY_IDS.has(k) || !o.nutriDone[k]) delete o.nutriDone[k]; });
  if(!o.workouts || !Array.isArray(o.workouts.weeks)) o.workouts = b.workouts;
  while(o.workouts.weeks.length<4) o.workouts.weeks.push({days:[]});
  o.workouts.weeks.forEach((wk,wi)=>{ if(!Array.isArray(wk.days)) wk.days=[];
    while(wk.days.length<7) wk.days.push({name:DAYS[wk.days.length],notes:'',exercises:[]});
    wk.days.forEach(d=>{ d.notes=d.notes||''; if(!Array.isArray(d.exercises)) d.exercises=[];
      d.exercises.forEach(e=>{ if(e.int==='Medium') e.int='Moderate'; if(!INTENS.includes(e.int)) e.int='Moderate'; e.url=e.url||''; e.notes=e.notes||''; e.video=e.video??''; }); }); });
  if(!o.workoutsAligned){ // sample workouts were laid out Mon..Sun; re-seat untouched sample days on the plan's weekdays (user-edited days are never replaced)
    const norm=d=>JSON.stringify([d.notes||'',d.exercises.map(e=>[e.name,+e.min,+e.kcal,e.int,e.video??'',!!e.done,e.url||'',e.notes||''])]);
    o.workouts.weeks.slice(0,4).forEach((wk,w)=>wk.days.slice(0,7).forEach((d,i)=>{
      if(norm(d)===norm(seedWorkDay(DAYS[i]))) wk.days[i]=seedWorkDay(PLAN_DAYS[w*7+i].weekday); }));
    o.workoutsAligned=true;
  }
  o.planStart = o.planStart || '';
  o.nutritionPlanVersion = PLAN.version;
  return o;
}
let S;
try { S = migrate(JSON.parse(localStorage.getItem(KEY)) || seed()); } catch(e){ S = seed(); }
save_();
function save_(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ alert('Storage is full – try a smaller profile picture.'); } };

const get = p => p.split('.').reduce((o,k)=>o?.[k], S);
const set = (p,v) => { const ks=p.split('.'); const last=ks.pop(); ks.reduce((o,k)=>o[k],S)[last]=v; };

/* ---------- compute ---------- */
const _et = new Map();
function entryTot(e){ // totals from the imported food items; null values are "unavailable", not 0
  if(_et.has(e.id)) return _et.get(e.id);
  const t={kcal:0,p:0,c:0,f:0,fiber:0}, miss={kcal:0,p:0,c:0,f:0,fiber:0};
  e.items.forEach(i=>NUT.forEach(n=>{ if(i[n.k]==null) miss[n.k]++; else t[n.k]+=i[n.k]; }));
  const r={t,miss}; _et.set(e.id,r); return r;
}
function dayCalc(day){
  const entries=[...day.meals, day.coffee];
  const planned={kcal:0,p:0,c:0,f:0,fiber:0}, consumed={...planned}, missing={...planned};
  let done=0, mealsDone=0;
  entries.forEach(e=>{ const x=entryTot(e), d=!!S.nutriDone[e.id]; if(d){done++; if(e!==day.coffee) mealsDone++;}
    NUT.forEach(n=>{ planned[n.k]+=x.t[n.k]; missing[n.k]+=x.miss[n.k]; if(d) consumed[n.k]+=x.t[n.k]; }); });
  const remaining={}; NUT.forEach(n=>{ planned[n.k]=r1(planned[n.k]); consumed[n.k]=r1(consumed[n.k]); remaining[n.k]=r1(planned[n.k]-consumed[n.k]); });
  return {planned,consumed,remaining,missing,done,total:entries.length,mealsDone,mealsTotal:day.meals.length};
}
function todayIndex(){
  if(S.planStart){ const d=Math.floor((new Date().setHours(0,0,0,0)-new Date(S.planStart+'T00:00:00'))/864e5); return Math.min(27,Math.max(0,d)); }
  const i=PLAN_DAYS.findIndex(d=>{const c=dayCalc(d);return c.done<c.total}); return i<0?27:i;
}
function dayWork(d){
  const ex=d.exercises; const dn=ex.filter(e=>e.done);
  return {done:dn.length,total:ex.length,min:dn.reduce((a,e)=>a+(+e.min||0),0),kcal:dn.reduce((a,e)=>a+(+e.kcal||0),0),
          pmin:ex.reduce((a,e)=>a+(+e.min||0),0),pkcal:ex.reduce((a,e)=>a+(+e.kcal||0),0)};
}
const pct = (a,b) => b>0 ? Math.min(100,Math.round(a/b*100)) : 0;
const barHtml = (a,b) => `<div class="bar ${pct(a,b)>=100?'ok':''}"><i style="width:${pct(a,b)}%"></i></div>`;

/* ---------- inputs ---------- */
const inp = (path,type='text',ph='') => type==='check'
  ? `<input type="checkbox" data-b="${path}" data-t="check" ${get(path)?'checked':''}>`
  : `<input type="${type==='number'?'number':type}" step="any" data-b="${path}" data-t="${type}" value="${esc(get(path))}" placeholder="${esc(ph)}">`;
const btn = (act,path,txt,cls='',extra='') => `<button class="${cls}" data-act="${act}" data-path="${path}" ${extra}>${txt}</button>`;

/* ---------- views ---------- */
const wLabel = (w,i,d) => { const p=PLAN_DAYS[w*7+i]; return p ? {full:`Day ${p.dayNumber} · ${p.weekday}`, short:`Day ${p.dayNumber} <small>${p.weekday.slice(0,3)}</small>`, plan:p} : {full:esc(d.name),short:esc(d.name.slice(0,6))}; };
function workTabs(){
  const w=S.ui.ww, weeks=S.workouts.weeks;
  return `<div class="tabs"><span class="lbl">Week</span>`+weeks.map((_,i)=>`<button class="${w===i?'on':''}" data-act="ui" data-k="ww" data-v="${i}">Week ${i+1}</button>`).join('')+`</div>
  <div class="tabs"><span class="lbl">Day</span>`+weeks[w].days.map((d,i)=>`<button class="${S.ui.wd===i?'on':''}" data-act="ui" data-k="wd" data-v="${i}">${wLabel(w,i,d).short}</button>`).join('')+`</div>`;
}
const safeUrl = u => /^https?:\/\//i.test(String(u||'').trim());
const isYT = u => /^https?:\/\/(www\.|m\.)?(youtube\.com|youtu\.be)\//i.test(String(u||'').trim());

function vDashboard(){
  const f = S.ui.dashWeek==='all' ? 'all' : (+S.ui.dashWeek||0);
  const wk = f==='all' ? [0,1,2,3] : [f];
  const ti = todayIndex(), td = PLAN_DAYS[ti], tc = dayCalc(td);
  const wsum = wk.reduce((a,w)=>{ PLAN.weeks[w].days.forEach(d=>{ const c=dayCalc(d); a.done+=c.done; a.total+=c.total; a.kc+=c.consumed.kcal; a.kp+=c.planned.kcal; }); return a; },{done:0,total:0,kc:0,kp:0});
  // workouts (independent of nutrition)
  const W = wk.reduce((a,w)=>{ (S.workouts.weeks[w]?.days||[]).forEach(d=>{ const x=dayWork(d); a.d+=x.done; a.t+=x.total; a.min+=x.min; a.kcal+=x.kcal; }); return a; },{d:0,t:0,min:0,kcal:0});
  const all = PLAN_DAYS.reduce((a,d)=>{ const c=dayCalc(d); a.done+=c.done; a.total+=c.total; a.mDone+=c.mealsDone; a.mTot+=c.mealsTotal; return a; },{done:0,total:0,mDone:0,mTot:0});
  const MW = S.workouts.weeks.reduce((a,wk)=>{ wk.days.forEach(d=>{ const x=dayWork(d); a.done+=x.done; a.total+=x.total; a.min+=x.min; a.kcal+=x.kcal; }); return a; },{done:0,total:0,min:0,kcal:0});
  const todayW = S.workouts.weeks[Math.floor(ti/7)]?.days[ti%7]; const tw = todayW ? dayWork(todayW) : null;
  return `${quote()}
  <div class="card"><div class="row"><h2>Dashboard</h2><span style="flex:1"></span>

function macroLine(n,c){
  const miss=c.missing[n.k];
  return `<div class="macro"><div class="row"><span>${n.label}</span><span>${r1(c.consumed[n.k])} / ${r1(c.planned[n.k])} ${n.unit} <small style="color:var(--muted)">(${r1(c.remaining[n.k])} left)${miss?` <span title="${miss} food item(s) in the PDF have no ${n.label.toLowerCase()} value">⚠</span>`:''}</small></span></div>${barHtml(c.consumed[n.k],c.planned[n.k])}</div>`;
}
const carbPill = d => `<span class="pill carb-${d.carbType.toLowerCase()}">${d.carbType} carb</span>`;
const nv = x => x==null ? '<span class="na" title="Not specified in the PDF">n/a</span>' : r1(x);

function mealCard(e, isCoffee){
  const id=e.id, done=!!S.nutriDone[id], t=entryTot(e), pdf=e.pdfTotal;
  const warn = NUT.filter(n=>t.miss[n.k]>0 && !isCoffee).map(n=>n.label);
  const diff = !isCoffee ? NUT.filter(n=>Math.abs(t.t[n.k]-pdf[n.k])>(n.k==='kcal'?1:0.15)+1e-9).map(n=>`${n.label}: items ${r1(t.t[n.k])} vs PDF ${pdf[n.k]}`) : [];
  return `<div class="meal ${done?'done':''}">
    <div class="meal-h"><input type="checkbox" data-b="nutriDone.${id}" data-t="check" ${done?'checked':''} aria-label="${esc(e.name)} completed">
      <h3 style="margin:0;font-size:1.15rem">${isCoffee?'☕ ':''}${esc(e.name)}</h3><span class="pill">${r1(t.t.kcal)} kcal</span>${isCoffee?'<span class="pill">tracked separately</span>':''}${done?'<span class="pill ok">✔ completed</span>':''}</div>
    <div class="scroll"><table class="ro"><thead><tr><th>Food</th><th>Quantity</th><th>kcal</th><th>P</th><th>C</th><th>F</th><th>Fiber</th></tr></thead><tbody>
    ${e.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${esc(i.quantity)}</td><td>${nv(i.kcal)}</td><td>${nv(i.p)}</td><td>${nv(i.c)}</td><td>${nv(i.f)}</td><td>${nv(i.fiber)}</td></tr>`).join('')}
    </tbody><tfoot><tr><td colspan="2">MEAL TOTAL</td><td>${r1(t.t.kcal)}</td><td>${isCoffee?nv(null):r1(t.t.p)}</td><td>${isCoffee?nv(null):r1(t.t.c)}</td><td>${isCoffee?nv(null):r1(t.t.f)}</td><td>${isCoffee?nv(null):r1(t.t.fiber)}</td></tr></tfoot></table></div>
    ${isCoffee?`<p class="note">PDF specifies calories only (~${pdf.kcal} kcal). Protein, carbs, fats and fiber are not available and are not estimated. It is <b>not</b> part of the PDF “daily total”; it is counted once in this app.</p>`:''}
    ${warn.length?`<p class="note">⚠ ${t.miss.fiber} item(s) have no ${warn.join('/').toLowerCase()} value in the PDF (shown as n/a, counted as 0 in totals).</p>`:''}
    ${diff.length?`<p class="note">⚠ PDF inconsistency flagged for review — PDF MEAL TOTAL differs from its items: ${diff.join('; ')}. Items are used for calculations.</p>`:''}
  </div>`;
}

const TABS=[['dashboard','📊 Dashboard',vDashboard],['nutrition','🍓 Nutrition',vNutrition],['workouts','💪 Workouts',vWorkouts],['videos','🎀 Videos',vVideos],['profile','🌷 Profile',vProfile]];

function render(){
  document.documentElement.dataset.theme=S.theme;
  const view=TABS.find(t=>t[0]===S.ui.tab)||TABS[0];
  const p=S.profile;
  const initial = p.name ? esc(p.name.trim().charAt(0).toUpperCase()) : '';
  $('#app').innerHTML=`<header class="top"><div class="brand">${LOGO}<h1>${p.name?esc(p.name)+"'s Pretty Plan":'My Pretty Plan'}</h1></div>
    <nav aria-label="Pages">${TABS.filter(t=>t[0]!=='profile').map(t=>`<button class="${t[0]===S.ui.tab?'on':''}" data-act="ui" data-k="tab" data-v="${t[0]}">${t[1]}</button>`).join('')}</nav>
    <div class="top-actions"><button class="ghost" data-act="theme">${S.theme==='dark'?'☀️ Light':'🌙 Dark'}</button>
    <button class="avatar-btn ${S.ui.tab==='profile'?'on':''}" data-act="ui" data-k="tab" data-v="profile" title="My profile" aria-label="My profile">${p.photo?`<img src="${p.photo}" alt="">`:(initial||'🌷')}</button></div></header>
    <main>${view[2]()}</main>`;
  const ph=$('#photo'); if(ph) ph.onchange=onPhoto;
  const im=$('#import'); if(im) im.onchange=onImport;
}

/* ---------- events ---------- */
document.addEventListener('change', e=>{
  const el=e.target; if(!el.dataset.b) return;
  let v = el.dataset.t==='check' ? el.checked : el.dataset.t==='number' ? (parseFloat(el.value)||0) : el.value;
  if(el.dataset.b.startsWith('nutriDone.')){ const id=el.dataset.b.slice(10); if(v) S.nutriDone[id]=true; else delete S.nutriDone[id]; }
  else set(el.dataset.b, v);
  save();
  const sc=window.scrollY; render(); window.scrollTo(0,sc);
});
const TPL={ex:newEx,video:()=>({name:'',url:'',type:'HIIT',notes:''})};
document.addEventListener('click', e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const d=b.dataset, a=d.act; const sc=window.scrollY;
  if(a==='ui'){ S.ui[d.k]=isNaN(d.v)||d.k==='vidFilter'||d.k==='tab'?d.v:+d.v; if(d.k==='tab') S.ui.dashWeek=S.ui.dashWeek; }
  else if(a==='gotoday'){ S.ui.tab='nutrition'; S.ui.nw=+d.w; S.ui.nd=+d.d; }
  else if(a==='theme') S.theme=S.theme==='dark'?'light':'dark';
  else if(a==='add') get(d.path).push(TPL[d.tpl]());
  else if(a==='del'){ if(!confirm('Remove this?')) return; get(d.path).splice(+d.i,1); }
  else if(a==='gotowork'){ S.ui.ww=+d.w; S.ui.wd=+d.d; }
  else if(a==='rmphoto') S.profile.photo='';
  else if(a==='export'){ const bl=new Blob([JSON.stringify(S)],{type:'application/json'}); const l=document.createElement('a'); l.href=URL.createObjectURL(bl); l.download='pretty-plan-backup.json'; l.click(); return; }
  else if(a==='reset'){ if(!confirm('Erase ALL data and start over?')) return; S=migrate(seed()); }
  save(); render(); window.scrollTo(0,sc);
});

function onPhoto(e){
  const f=e.target.files[0]; if(!f) return;
  const img=new Image(), rd=new FileReader();
  rd.onload=()=>{ img.onload=()=>{ const c=document.createElement('canvas'), s=300, r=Math.min(img.width,img.height);
      c.width=c.height=s; c.getContext('2d').drawImage(img,(img.width-r)/2,(img.height-r)/2,r,r,0,0,s,s);
      S.profile.photo=c.toDataURL('image/jpeg',.85); save(); render(); };
    img.src=rd.result; };
  rd.readAsDataURL(f);
}
function onImport(e){
  const f=e.target.files[0]; if(!f) return; const rd=new FileReader();
  rd.onload=()=>{ try{ const o=JSON.parse(rd.result); if(!o.workouts||!o.profile) throw 0; S=migrate(o); save(); render(); }catch(x){ alert('That file is not a valid backup.'); } };
  rd.readAsText(f);
}

window.__app={get S(){return S},PLAN,PLAN_DAYS,dayCalc,render,save};
render();
</script>
