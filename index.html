<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weight Loss Challenge</title>
<meta name="application-name" content="Weight Loss Challenge">
<meta name="apple-mobile-web-app-title" content="Weight Loss Challenge">
<meta name="description" content="Weight Loss Challenge — nutrition, workouts and progress tracker">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F5F2; --card:#FFFFFF; --ink:#1F1D1B; --muted:#6B6760; --accent:#8A5A4D; --accent-soft:#F3ECE8;
  --soft:#F1EFEB; --line:#E7E4DE; --field:#FFFFFF; --on:#FFFFFF; --ok:#4F7F63; --err:#A5483B; --ok-soft:#E7F0EA;
  --wm-op:.11; --g1:#F1E4D8; --g2:#ECE0D8; --shadow:0 1px 2px #1f1d1b0a; --r:14px; --r-sm:8px;
  --low:#EDEAE4; --mod:#F1E7D3; --high:#F0DDD6; --bar:#E9E6E0;
  --water:#7DB9E3; --water2:#A9D3EE; --over:#A8503F; --over-soft:#F6E4DE; --amb:#80600F; --amb-soft:#F7ECCF;
  --th:transparent; --th-wt:var(--card); --zebra:transparent; --elev:var(--card); --hover:var(--soft);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#242321; --card:#302E2B; --elev:#393630; --ink:#F4F0EA; --muted:#BDB5AA; --accent:#D4B5A0; --accent-soft:#3D3731;
  --soft:#383530; --line:#48433D; --field:#272624; --on:#2A211B; --ok:#8FBF9F; --ok-soft:#2F3A33; --err:#E8998B;
  --shadow:0 1px 0 #ffffff08,0 8px 22px #00000030; --wm-op:.055; --g1:#34302A; --g2:#2E2825;
  --low:#443F38; --mod:#4D422E; --high:#52403A; --bar:#4A453F;
  --water:#6FA9D9; --water2:#8DBFE6; --over:#EBA797; --over-soft:#4B3028; --amb:#E8C57A; --amb-soft:#463B1F;
  --th:#403B35; --th-wt:#403B35; --zebra:#35322E; --hover:#454039;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.5;background:radial-gradient(1100px 650px at 92% -5%,var(--g1),transparent 65%),radial-gradient(900px 600px at -5% 105%,var(--g2),transparent 65%),var(--bg);background-attachment:fixed;color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
html::before,body::before,body::after{content:"";position:fixed;pointer-events:none;z-index:0;background-repeat:no-repeat;background-size:contain;opacity:var(--wm-op,.11)}
body::before{right:-4vw;bottom:-90px;width:clamp(360px,38vw,760px);aspect-ratio:420/780;background-image:var(--wm1);background-position:bottom right}
body::after{left:-6vw;top:60px;width:clamp(260px,29vw,560px);aspect-ratio:420/780;background-image:var(--wm2);transform:rotate(-8deg);opacity:calc(var(--wm-op,.11)*.85)}
html::before{left:26vw;bottom:-160px;width:clamp(240px,24vw,480px);aspect-ratio:420/780;background-image:var(--wm2);transform:rotate(14deg);opacity:calc(var(--wm-op,.11)*.55)}
#app{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:0 20px 48px}
h1,h2,h3{font-weight:600;color:var(--ink);margin:0;letter-spacing:-.01em}
h2{font-size:1.25rem}
h3{font-size:.95rem}
main>h2{margin:20px 0 14px}
p{margin:.4em 0}
small{font-size:.78rem}
a{color:var(--accent);text-decoration:none;font-weight:500}a:hover{text-decoration:underline}
/* header */
header.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;position:relative;z-index:6;background:transparent;padding:12px 20px;margin:0 -20px}
.brand{display:flex;align-items:center;gap:10px;justify-self:start;font-weight:600;letter-spacing:-.01em}
.brand .logo{width:30px;height:30px;color:var(--accent)}
nav{display:flex;gap:2px;justify-self:center}
nav button{background:transparent;color:var(--muted);border:0;border-radius:var(--r-sm);padding:7px 14px;font-weight:500;box-shadow:none}
nav button:hover{color:var(--ink);background:var(--hover)}
nav button.on{color:var(--ink);background:var(--soft);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}
.top-actions{display:flex;align-items:center;gap:10px;justify-self:end}
.avatar-btn{width:36px;height:36px;padding:0;border-radius:50%;overflow:hidden;background:var(--accent-soft);color:var(--accent);border:1px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:600}
.avatar-btn img{width:100%;height:100%;object-fit:cover;display:block}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:44px;min-width:150px;background:var(--elev);border:1px solid var(--line);border-radius:var(--r-sm);box-shadow:0 8px 24px #00000022;padding:4px;z-index:20;display:flex;flex-direction:column}
.menu button{background:transparent;color:var(--ink);text-align:left;border:0;padding:8px 12px;border-radius:6px;font-weight:500}
.menu button:hover{background:var(--hover)}.menu button.on{color:var(--accent);font-weight:600}
.at{min-width:780px;table-layout:fixed}
.at th:nth-child(1){width:28%}.at th:nth-child(2){width:17%}.at th:nth-child(n+3):nth-child(-n+7){width:9%}.at th:nth-child(8){width:84px}
.at td{padding:5px}
.at td input{margin:0;background:transparent;border-color:transparent;padding:5px 7px}
.at td input:hover{border-color:var(--line)}.at td input:focus{background:var(--field);border-color:var(--accent)}
.at td:nth-child(n+3):nth-child(-n+7) input,.at th:nth-child(n+3):nth-child(-n+7){text-align:right}
.at tfoot td{font-weight:600;background:var(--soft);border-top:1px solid var(--line);border-bottom:0;font-size:.8rem;letter-spacing:.04em}
.at tfoot td:nth-child(n+3){text-align:right}
.wt.rot{min-width:700px}
.wt.rot th:nth-child(1){width:54px}.wt.rot th:nth-child(2){width:41%}.wt.rot th:nth-child(3){width:104px}.wt.rot th:nth-child(4),.wt.rot th:nth-child(5){width:92px}.wt.rot th:nth-child(6){width:76px}.wt.rot th:nth-child(7){width:auto}
.wt.rot td{padding:9px 8px}.wt.rot td.c-name{white-space:normal}.wt.rot td.c-num{text-align:right}.wt.rot td.c-notes{white-space:normal;color:var(--muted)}
.avatar-btn.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
/* controls */
button,select,input,textarea{font:inherit;color:var(--ink)}
button{cursor:pointer;border:1px solid transparent;border-radius:var(--r-sm);padding:7px 14px;background:var(--accent);color:var(--on);font-weight:500}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
button.ghost:hover{background:var(--hover)}
button.small{padding:4px 10px;font-size:.8rem}
button.x{background:transparent;color:var(--muted);border:0;padding:2px 8px;font-size:1.1rem;line-height:1}
button.x:hover{color:var(--ink)}
label{display:block;font-size:.75rem;color:var(--muted);font-weight:500}
input,select,textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 10px;margin-top:4px}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--ok);margin:0;flex:none}
textarea{min-height:64px;resize:vertical}
/* layout */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.card>h3:first-child,.card>.row:first-child{margin-bottom:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.quote{color:var(--muted);font-size:.85rem;margin:16px 0 0}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.tabs button{background:transparent;color:var(--muted);border:1px solid transparent;padding:5px 11px;font-weight:500}
.tabs button:hover{background:var(--hover);color:var(--ink)}
.tabs button.on{background:var(--accent-soft);color:var(--accent);border-color:var(--line);font-weight:600}
.tabs button.today{position:relative}
.tabs button.today::after{content:"";position:absolute;top:4px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--ok)}
.tabs .lbl{font-size:.72rem;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;min-width:44px;margin-right:6px}
/* tables */
table{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
th{background:var(--th);color:var(--muted);font-size:.7rem;font-weight:500;text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line)}
table.ro th:nth-child(n+3),table.ro td:nth-child(n+3){text-align:right}
table.ro td:first-child{min-width:150px}
table.ro td,table.ro th{white-space:nowrap}
table.ro td:first-child{white-space:normal}
table.ro tbody tr:last-child td{border-bottom:0}
.meal table.ro{table-layout:fixed;min-width:580px}
.meal table.ro th:nth-child(1){width:34%}.meal table.ro th:nth-child(2){width:20%}
.meal table.ro th:nth-child(n+3){width:9.2%}
.meal table.ro td:first-child{min-width:0}
.meal table.ro td:nth-child(2),.meal table.ro th:nth-child(2){text-align:left}
.meal table.ro tfoot td:nth-child(n+2),table.ro tfoot td:nth-child(n+2){text-align:right}
table.ro tfoot td:first-child{text-align:left}
table.ro tfoot td{font-weight:600;color:var(--ink);background:var(--soft);border-top:1px solid var(--line);border-bottom:0;font-size:.8rem;letter-spacing:.04em}
tr.ref td{color:var(--muted);font-size:.8rem}
.na{color:var(--muted);font-size:.8rem}
.scroll{overflow-x:auto;margin:0 -4px;padding:0 4px}
/* components */
.meal,.ex{border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 12px;background:var(--card)}
.meal,.wt tbody tr{transition:background-color .18s ease,border-color .18s ease,box-shadow .18s ease}
.meal.done{background:var(--ok-soft);border-color:var(--ok);box-shadow:inset 3px 0 0 var(--ok)}
.meal.done table.ro tbody tr{background:transparent}
.meal.done table.ro tfoot td{background:color-mix(in srgb,var(--ok) 12%,transparent)}
:root[data-theme="dark"] .meal.done table.ro tbody tr:nth-child(even){background:color-mix(in srgb,var(--ok) 9%,transparent)}
.wt tbody tr.done td:first-child{box-shadow:inset 3px 0 0 var(--ok)}
.done-tag{display:inline-block;margin-left:8px;font-size:.72rem;font-weight:500;color:var(--ok);white-space:nowrap}
@keyframes settle{from{background-color:transparent;border-color:var(--line)}}
.meal.pop,.wt tbody tr.pop{animation:settle .18s ease}
.ex.done{border-color:var(--ok)}
.meal-h{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.meal-h h3{font-size:.95rem}
.meal-h button{flex:none;white-space:nowrap}
.meal-h input[type=text]{margin:0;font-weight:500}
.bar{height:6px;background:var(--bar);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.bar.ok i{background:var(--ok)}
.stat b{display:block;font-size:1.3rem;font-weight:600;letter-spacing:-.02em}
.stat span{font-size:.75rem;color:var(--muted);font-weight:400}
.stat .bar{margin-top:6px}
.pill{display:inline-block;background:var(--soft);color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:1px 10px;font-size:.72rem;font-weight:500}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.carb-low{background:var(--low)}.pill.carb-moderate{background:var(--mod)}.pill.carb-high{background:var(--high)}
.pill.carb-low,.pill.carb-moderate,.pill.carb-high{color:var(--ink);border-color:transparent}
.macro{margin:0 0 12px}
.macro .row{justify-content:space-between;font-size:.8rem;margin-bottom:5px;gap:6px}
.macro .row span:first-child{color:var(--muted)}
.star{color:var(--muted);cursor:help}
.prog-row{display:grid;grid-template-columns:170px 1fr 1fr 10px;gap:14px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:.85rem}
.prog-row:last-child{border-bottom:0}
.prog-row small{color:var(--muted)}
.vid{display:grid;grid-template-columns:1fr 1fr 130px 1fr auto;gap:12px;align-items:end;padding:12px 0;border-bottom:1px solid var(--line)}
.profile-top{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.avatar-up{position:relative;width:104px;height:104px;border-radius:50%;padding:0;background:none;border:0;cursor:pointer;flex:none;display:grid;place-items:center;box-shadow:none;transition:transform .18s ease}
.avatar-up:hover{transform:scale(1.03)}.avatar-up:hover .big-avatar{filter:brightness(.94)}
.avatar-up.drag .big-avatar{outline:2px dashed var(--accent);outline-offset:3px}
.avatar-cam{position:absolute;right:2px;bottom:4px;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on);display:grid;place-items:center;box-shadow:0 0 0 3px var(--card);transition:transform .18s ease}
.avatar-up:hover .avatar-cam{transform:scale(1.08)}
.photo-meta{min-width:0}
.big-avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;border:1px solid var(--line);background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:1.8rem;font-weight:600}
/* dashboard */
.dash-head{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin:22px 0 16px}
.dash-head h2{font-size:1.5rem}
.dash-head .sub{color:var(--muted);font-size:.85rem}
.big{font-size:2rem;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:4px 0 14px}
.mcell{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 2px;border-radius:10px;background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:500}
.mcell b{font-size:.8rem}.mcell small,.mcell em{font-size:.68rem;font-style:normal;color:var(--muted)}
.mcell i{display:block;width:40%;height:3px;border-radius:9px;margin:3px 0}
.carb-low{background:var(--low)}.carb-moderate{background:var(--mod)}.carb-high{background:var(--high)}
.mcell.full{background:var(--ok-soft);border-color:var(--ok)}.mcell.part{border-color:var(--accent)}.mcell.today{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--accent)}
.legend{display:inline-block;width:10px;height:10px;border-radius:3px;border:1px solid var(--line);vertical-align:-1px;margin:0 3px 0 10px}.legend.full{border-color:var(--ok);background:var(--ok-soft)}.legend.part{border-color:var(--accent)}
.ex a,label a{font-size:.78rem}
.wt{min-width:900px;table-layout:fixed}
.wt th:nth-child(1){width:54px}.wt th:nth-child(2){width:19%}.wt th:nth-child(3){width:118px}.wt th:nth-child(4),.wt th:nth-child(5){width:100px}.wt th:nth-child(6){width:22%}.wt th:nth-child(8){width:84px}
.wt th{white-space:nowrap}.wt td{vertical-align:middle;padding:6px 6px}
.wt tbody tr:nth-child(odd){background:var(--card)}.wt tbody tr:nth-child(even){background:var(--soft)}
.wt tbody tr.done{background:var(--ok-soft)}
.wt td input:not([type=checkbox]),.wt td select{margin:0;background:transparent;border-color:transparent;padding:5px 7px}
.wt td input:not([type=checkbox]):hover,.wt td select:hover{border-color:var(--line)}
.wt td input:not([type=checkbox]):focus,.wt td select:focus{background:var(--field);border-color:var(--accent)}
.wt td.c-num input{text-align:right}
.wt td.c-done,.wt th:first-child{text-align:center}
.wt td.c-done input[type=checkbox]{display:block;margin:0 auto;vertical-align:middle}
.wt td{vertical-align:middle}
.wt tbody tr.done td.c-name input{color:var(--muted)}
.vidcell{display:flex;gap:6px;align-items:center}.vidcell a{font-size:.8rem;white-space:nowrap}
.wt select.lib{font-size:.75rem;color:var(--muted);padding:2px 7px;margin-top:2px}
.wt tfoot td{background:transparent;border-top:1px solid var(--line);font-size:.75rem;color:var(--muted);letter-spacing:.05em}
.wt th:nth-child(1),.wt td:nth-child(1),.wt th:nth-child(2),.wt td:nth-child(2){position:sticky;background:inherit;z-index:1}
.wt th:nth-child(1),.wt td:nth-child(1){left:0}.wt th:nth-child(2),.wt td:nth-child(2){left:54px}
.wt thead th{background:var(--th-wt)}
.wt thead th:nth-child(-n+2){background:var(--th-wt);z-index:2}
.at tbody tr:nth-child(even){background:var(--zebra)}
.wt tfoot td:nth-child(1),.wt tfoot td:nth-child(2){position:static}
.ex-list{list-style:none;margin:0;padding:0}
.ex-list li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.85rem}
.ex-list li:last-child{border-bottom:0}
.ex-list .d{color:var(--ok)}
@media(max-width:900px){ .brand span{display:none} }
@media(max-width:860px){
  header.top{grid-template-columns:auto 1fr;grid-template-areas:"brand actions" "nav nav"}
  .brand{grid-area:brand}.top-actions{grid-area:actions}
  nav{grid-area:nav;justify-self:stretch;overflow-x:auto;justify-content:center}
  nav button{white-space:nowrap}
  nav{scrollbar-width:none}nav::-webkit-scrollbar{display:none}
}

.acct{font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--soft);color:var(--muted);white-space:nowrap}
.acct.admin{color:var(--accent);border-color:var(--accent)}
#toasts{position:fixed;top:max(12px,calc(env(safe-area-inset-top) + 8px));left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;width:max-content;max-width:calc(100vw - 28px - env(safe-area-inset-left) - env(safe-area-inset-right));pointer-events:none}
.toast{display:flex;align-items:center;gap:8px;background:var(--elev);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:.85rem;font-weight:500;line-height:1.35;box-shadow:0 8px 24px #0000001f;opacity:0;transform:translateY(-8px);transition:opacity .22s,transform .22s;max-width:100%;overflow-wrap:anywhere}
.toast.show{opacity:1;transform:none}
.toast.undo .ti{background:var(--soft);color:var(--muted)}
.toast .ti{flex:none;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--ok-soft);color:var(--ok);font-size:.72rem;font-weight:700}
.toast.err{border-color:var(--err)}.toast.err .ti{background:transparent;color:var(--err);border:1px solid var(--err)}
.toast.warn{border-color:var(--amb,#c58a2a)}.toast.warn .ti{background:transparent;color:var(--amb,#c58a2a);border:1px solid var(--amb,#c58a2a)}
.bar.sage i{background:var(--ok)}
.wchart{width:100%;height:auto;display:block}
.wc-grid{stroke:var(--line);stroke-width:1}.wc-txt{fill:var(--muted);font-size:11px}
.wc-line{fill:none;stroke:var(--ok);stroke-width:2;stroke-linejoin:round}.wc-dot{fill:var(--card);stroke:var(--ok);stroke-width:2}
.wc-goal{stroke:var(--accent);stroke-width:1.2;stroke-dasharray:4 4}
.wh{min-width:360px;table-layout:auto}.wh th:nth-child(4){width:84px}.wd-good{color:var(--ok)}
.wh td input{max-width:170px}
.qtycell{white-space:nowrap}.qtycell input{width:76px;display:inline-block}.qtycell .unit{margin-left:6px;color:var(--muted);font-size:.8rem}
.rov{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.at td input:disabled{opacity:.55}
.cats{display:flex;gap:4px;flex-wrap:wrap;min-width:230px}
.cats button{padding:2px 8px;font-size:.72rem;border-radius:99px;background:var(--card);color:var(--muted);border:1px solid var(--line);font-weight:500}
.cats button.on{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.pill.flag{margin-left:6px;color:var(--err);border-color:var(--err);background:transparent}

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

const QUOTES = [
  "Small steps every day become big changes.","Progress, not perfection.","Be proud of every healthy choice you make.",
  "Your only competition is who you were yesterday.","Strong is the new pretty.","Discipline is a form of self-care.",
  "You didn't come this far to only come this far.","Consistency beats intensity.","Feed your body, fuel your goals.",

];

/* botanical line-art watermark (generated once per theme) */
function botanical(color, flip){
  const leaf=(x,y,a,sc)=>`<g transform="translate(${x} ${y}) rotate(${a}) scale(${sc})"><path d="M0 0C28 -34 78 -34 112 0C78 34 28 34 0 0Z"/><path d="M6 0C40 -3 74 -3 104 0" /></g>`;
  let g=`<path d="M200 760C188 600 236 470 196 320C172 230 190 130 214 30"/>`, y=700, a=-38, sc=1;
  for(let i=0;i<9;i++){ const x=200+(i%2?-6:6)*(i/2); g+=leaf(x,y,i%2?180+(-a)-6:a,sc*(1-i*.07)); g+=leaf(x,y-28,i%2?a:180-a-6,sc*(1-i*.07)*.82); y-=68; }

  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 780"><g fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" ${flip?'transform="translate(420 0) scale(-1 1)"':''}>${g}</g></svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
}
function applyWatermark(){ const c=S.theme==='dark'?'#D9CFC6':'#5B4D45', st=document.documentElement.style; st.setProperty('--wm1',botanical(c,false)); st.setProperty('--wm2',botanical(c,true)); }

/* ---------- state ---------- */
const KEY = 'prettyplan.v1';
const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const INTENS = ['Low','Moderate','High'];
const newEx = () => ({name:'',min:0,kcal:0,int:'Moderate',video:'',url:'',notes:'',done:false});

const LEGS_DAYS=['Monday','Wednesday','Friday'];
function seedWorkDay(weekday){ // sample plan: rest on Sunday, legs Mon/Wed/Fri, abs Tue/Thu/Sat
  if(weekday==='Sunday') return {name:weekday,notes:'Rest day — stretch and relax',exercises:[]};
  const ex=(name,min,kcal,int)=>({name,min,kcal,int,video:'',url:'',notes:'',done:false});
  const base=[ex('Treadmill',30,250,'Moderate')];
  base.push(LEGS_DAYS.includes(weekday)?ex('Glutes & legs',25,180,'High'):ex('Abs & core',15,90,'Moderate'));
  return {name:weekday,notes:'',exercises:base};
}
function seed(){
  return {
    theme:'light',
    ui:{tab:'dashboard',nw:0,nd:0,ww:0,wd:0,dashWeek:'all',vidFilter:'all',adminTab:'nutrition',editTab:'nutrition',nm:0,hd:0},
    profile:{name:'',weight:'',height:'',gender:'Female',birthday:'',photo:''},
    nutriDone:{}, planStart:'', nutritionPlanVersion:PLAN.version,
    workouts:{weeks:Array.from({length:4},(_,w)=>({days:DAYS.map((_,i)=>seedWorkDay(PLAN_DAYS[w*7+i].weekday))}))}, workoutsAligned:true,
    videos:[
      {name:'20 min HIIT fat burn',url:'https://www.youtube.com/results?search_query=20+min+hiit+workout',type:'HIIT',notes:''},
      {name:'Glute workout at home',url:'https://www.youtube.com/results?search_query=glute+workout+at+home',type:'Muscles',notes:''},
    ]
  };
}
const PLAN_KEY = KEY+'.plan';   // admin-edited copy of the nutrition plan (falls back to the PDF import)
const SYNC={enabled:!!(window.supabase&&window.SUPABASE_CONFIG&&window.SUPABASE_CONFIG.syncEnabled===true&&window.SUPABASE_CONFIG.url&&window.SUPABASE_CONFIG.publishableKey&&!/PASTE_/i.test(window.SUPABASE_CONFIG.publishableKey)),on:false,state:'off',uid:null,busy:false,again:false,timer:null,poll:null,fail:0,msg:'',shadow:{},bound:false,planReady:false,base:null,baseMeals:null,baseDays:null,planDirty:false};   // cloud-sync state (see cloud sync section)
function loadPlan(){
  const base=window.NUTRITION_PLAN;
  try{ const o=JSON.parse(localStorage.getItem(PLAN_KEY));
    if(o&&o.weeks&&o.weeks.length===4&&o.weeks.every(w=>w.days&&w.days.length===7&&w.days.every(d=>Array.isArray(d.meals)&&d.coffee&&Array.isArray(d.coffee.items)))){
      if((o.version||1)===base.version) return o;                      // the admin-edited copy of the CURRENT plan
      const bk=PLAN_KEY+'-v'+(o.version||1)+'-backup';                  // an older plan: keep it untouched under a backup key, show the new baseline
      if(!SYNC.enabled&&!localStorage.getItem(bk)) localStorage.setItem(bk,JSON.stringify(o)); } }catch(e){}
  return JSON.parse(JSON.stringify(base));
}
const PLAN = loadPlan();
const PLAN_BOOT_SIG = JSON.stringify(PLAN.weeks);   // used to tell whether nutrition-plan edits exist that only live on this device
const SYNC_PLAN_HOOK=()=>{ SYNC.planDirty=true; SYNC.gen=(SYNC.gen||0)+1; return cacheSave(); };
const savePlan = () => { if(SYNC.enabled) return SYNC.on?SYNC_PLAN_HOOK():true; try{ localStorage.setItem(PLAN_KEY, JSON.stringify(PLAN)); return true; }catch(e){ return false; } };
const PLAN_DAYS = PLAN.weeks.flatMap(w=>w.days);
const entryIds = () => new Set(PLAN_DAYS.flatMap(d=>[...d.meals,d.coffee].map(e=>e.id)));
const NUT = [{k:'kcal',label:'Calories',short:'kcal',unit:'kcal'},{k:'p',label:'Protein',short:'P',unit:'g'},{k:'c',label:'Carbohydrates',short:'C',unit:'g'},{k:'f',label:'Fats',short:'F',unit:'g'},{k:'fiber',label:'Fiber',short:'Fi',unit:'g'}];
function migrate(o){
  const b = seed();

    delete o.nutrition;

  : `<input type="${type==='number'||type==='nnum'?'number':type}" step="any" data-b="${path}" data-t="${type}" value="${esc(get(path))}" placeholder="${esc(ph)}">`;
const btn = (act,path,txt,cls='',extra='') => `<button class="${cls}" data-act="${act}" data-path="${path}" ${extra}>${txt}</button>`;

/* ---------- views ---------- */
const wLabel = (w,i,d) => { const p=PLAN_DAYS[w*7+i]; return p ? {full:`Day ${p.dayNumber} · ${p.weekday}`, short:`Day ${p.dayNumber} <small>${p.weekday.slice(0,3)}</small>`, plan:p} : {full:esc(d.name),short:esc(d.name.slice(0,6))}; };
function workTabs(){

}
const safeUrl = u => /^https?:\/\//i.test(String(u||'').trim());
const isYT = u => /^https?:\/\/(www\.|m\.)?(youtube\.com|youtu\.be)\//i.test(String(u||'').trim());

/* ---------- weight goal & history (doda only) ---------- */
function isoToday(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function weightStats(){
  const W=S.weight, es=[...W.entries].sort((a,b)=>a.date.localeCompare(b.date));
  const cur=es.length?es.at(-1).kg:null, start=W.start!=null?W.start:(es.length?es[0].kg:null), goal=W.goal;
  const gain=goal!=null&&start!=null&&goal>start;
  let pct=0, remaining=null, change=null;
  if(cur!=null&&start!=null) change=gain?cur-start:start-cur;
  if(cur!=null&&goal!=null){ remaining=Math.max(0,gain?goal-cur:cur-goal); }
  if(cur!=null&&start!=null&&goal!=null&&goal!==start){ const p=(cur-start)/(goal-start)*100; pct=Number.isFinite(p)?Math.min(100,Math.max(0,p)):0; }
  return {cur,start,goal,gain,change,remaining,pct:Math.round(pct),has:cur!=null||start!=null||goal!=null};
}
const sageBar=p=>`<div class="bar sage" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div>`;
const kg=n=>n==null?'—':r1(n)+' kg';
function weightChart(){
  const es=[...S.weight.entries].sort((a,b)=>a.date.localeCompare(b.date));
  if(es.length<2) return '<p class="na" style="margin:0">Add at least two entries to see your trend.</p>';
  const W=640,H=210,pl=46,pr=14,pt=14,pb=28, goal=S.weight.goal;
  const vals=es.map(e=>e.kg).concat(goal!=null?[goal]:[]); let lo=Math.min(...vals), hi=Math.max(...vals); const pad=Math.max(.5,(hi-lo)*.15); lo-=pad; hi+=pad;
  const t=e=>new Date(e.date+'T00:00:00').getTime(), t0=t(es[0]), t1=t(es.at(-1));
  const x=(e,i)=>pl+(t1===t0?i/(es.length-1):(t(e)-t0)/(t1-t0))*(W-pl-pr), y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
  const grid=[0,1,2,3].map(k=>{ const v=lo+(hi-lo)*k/3, yy=y(v); return `<line class="wc-grid" x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}"/><text class="wc-txt" x="${pl-6}" y="${yy+4}" text-anchor="end">${r1(v)}</text>`; }).join('');
  const pts=es.map((e,i)=>`${x(e,i).toFixed(1)},${y(e.kg).toFixed(1)}`).join(' ');
  return `<svg class="wchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend">${grid}
    ${goal!=null?`<line class="wc-goal" x1="${pl}" x2="${W-pr}" y1="${y(goal)}" y2="${y(goal)}"/><text class="wc-txt" x="${W-pr}" y="${y(goal)-5}" text-anchor="end">Goal ${r1(goal)}</text>`:''}
    <polyline class="wc-line" points="${pts}"/>${es.map((e,i)=>`<circle class="wc-dot" cx="${x(e,i).toFixed(1)}" cy="${y(e.kg).toFixed(1)}" r="3.5"><title>${esc(e.date)}: ${r1(e.kg)} kg</title></circle>`).join('')}
    <text class="wc-txt" x="${pl}" y="${H-6}">${esc(es[0].date)}</text><text class="wc-txt" x="${W-pr}" y="${H-6}" text-anchor="end">${esc(es.at(-1).date)}</text></svg>`;
}
function weightSection(){
  const W=S.weight, st=weightStats(), today=isoToday();
  const rows=W.entries.map((e,i)=>({e,i})).sort((a,b)=>b.e.date.localeCompare(a.e.date)||b.i-a.i);
  return `<div class="card" id="weight"><h3>Weight tracking</h3>
    <div class="grid g2" style="margin:12px 0 16px"><label>Starting weight (kg)${inp('weight.start','nnum','kg')}</label><label>Goal weight (kg)${inp('weight.goal','nnum','kg')}</label></div>
    <div class="grid g4"><div class="stat"><b>${kg(st.cur)}</b><span>current</span></div><div class="stat"><b>${st.change==null?'—':r1(st.change)+' kg'}</b><span>${st.gain?'weight gained':'weight lost'}</span></div>
      <div class="stat"><b>${kg(st.remaining)}</b><span>remaining</span></div><div class="stat"><b>${st.pct}%</b><span>goal progress</span></div></div>
    <div style="margin:12px 0 20px">${sageBar(st.pct)}</div>
    <h3 style="margin-bottom:10px">Trend</h3>${weightChart()}
    <h3 style="margin:22px 0 10px">Add weight entry</h3>
    <div class="row" style="align-items:flex-end"><label>Date<input type="date" id="wDate" value="${today}" max="${today}"></label><label>Weight (kg)<input type="number" step="0.1" id="wKg" placeholder="${st.cur!=null?r1(st.cur):'kg'}"></label>${btn('addweight','','Add entry','')}</div>
    <h3 style="margin:22px 0 6px">History</h3>
    <div class="scroll"><table class="at wh"><thead><tr><th>Date</th><th>Weight</th><th>Change</th><th></th></tr></thead><tbody>
    ${rows.map((r,k)=>{ const prev=rows[k+1], ch=prev?r.e.kg-prev.e.kg:null; return `<tr><td>${inp(`weight.entries.${r.i}.date`,'date')}</td><td>${inp(`weight.entries.${r.i}.kg`,'number','kg')}</td>
      <td class="${ch==null?'na':ch<0===!st.gain&&ch!==0?'wd-good':'na'}">${ch==null?'—':(ch>0?'+':ch<0?'−':'')+r1(Math.abs(ch))+' kg'}</td><td>${btn('del','weight.entries','Delete','small ghost','data-i="'+r.i+'" aria-label="Delete entry"')}</td></tr>`}).join('')||'<tr><td colspan="4" class="na" style="padding:14px 6px">No entries yet.</td></tr>'}
    </tbody></table></div></div>`;
}
function weightCard(){
  const st=weightStats();
  return `<div class="card"><div class="row"><h3>Weight goal</h3><span class="spacer"></span><button class="small ghost" data-act="gotoweight">Weight history</button></div>
    ${st.has?`<div class="grid g4" style="margin:12px 0"><div class="stat"><b>${kg(st.cur)}</b><span>current</span></div><div class="stat"><b>${kg(st.goal)}</b><span>goal</span></div><div class="stat"><b>${kg(st.remaining)}</b><span>remaining</span></div><div class="stat"><b>${st.pct}%</b><span>progress</span></div></div>${sageBar(st.pct)}`
    :'<p class="na" style="margin:10px 0 0">Set a starting and goal weight in your profile to track progress.</p>'}</div>`;
}

/* ---------- hydration (doda only): 3 L goal, per plan day ---------- */
const WATER_DEFAULT=3000;
const waterGoal=()=>{ const g=+(S.hydration&&S.hydration.goal); return g>=500&&g<=10000?Math.round(g):WATER_DEFAULT; };   // synced as user_settings.hydration_goal_ml
const hydId=i=>PLAN_DAYS[i]?PLAN_DAYS[i].id:null;
const hydEntries=i=>{ const id=hydId(i); return (id&&S.hydration.days[id])||[]; };
const hydTotal=i=>hydEntries(i).reduce((a,e)=>a+(+e.ml||0),0);
const hydTotalById=id=>((S.hydration.days[id])||[]).reduce((a,e)=>a+(+e.ml||0),0);
const hydDay=()=>{ const v=S.ui.hd; return Number.isInteger(v)&&v>=0&&v<PLAN_DAYS.length?v:(curIdx()??0); };
const fmtL=ml=>(Math.round(ml/10)/100).toString()+' L';
let hydPrevY=null;
function hydrationCard(idx,nav=true){
  const i=idx==null?hydDay():idx, total=hydTotal(i), pct=Math.min(100,Math.round(total/waterGoal()*100)), left=Math.max(0,waterGoal()-total), d=PLAN_DAYS[i], isNow=curIdx()===i;
  const top=44, bot=240, y=Math.round(bot-(bot-top)*pct/100), from=hydPrevY==null?y:hydPrevY; hydPrevY=y;
  const list=hydEntries(i); const id=hydId(i);
  const wave=`M0 0 q15 -7 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 V260 H0z`;
  const body='M42 36 h36 v14 c0 10 22 16 22 40 v140 c0 12-8 20-20 20 H40 c-12 0-20-8-20-20 V90 c0-24 22-30 22-40z';
  return `<div class="card hyd"><div class="row"><h3>Hydration</h3><span class="spacer"></span>
      ${nav?`<button class="x" data-act="hydday" data-dir="-1" aria-label="Previous day" ${i===0?'disabled':''}>‹</button>`:''}<span class="na" style="min-width:92px;text-align:center">Day ${d.dayNumber} · ${esc(d.weekday.slice(0,3))}${isNow?' · today':''}</span>${nav?`<button class="x" data-act="hydday" data-dir="1" aria-label="Next day" ${i===PLAN_DAYS.length-1?'disabled':''}>›</button>`:''}</div>
    <div class="hyd-body"><svg class="bottle" viewBox="0 0 120 262" role="img" aria-label="Water bottle ${pct}% full"><defs><clipPath id="bclip"><path d="${body}"/></clipPath></defs>
        <rect class="b-cap" x="46" y="12" width="28" height="22" rx="6"/>
        <g clip-path="url(#bclip)"><rect class="b-bg" x="0" y="0" width="120" height="262"/>
          <g class="water" data-y="${y}" style="--y:${from}px"><g class="wave w2"><path d="${wave}"/></g><g class="wave w1"><path d="${wave}"/></g></g></g>
        <path class="b-out" d="${body}"/><path class="b-shine" d="M32 100 v90"/>
        ${[25,50,75].map(p=>`<line class="b-tick" x1="100" x2="108" y1="${bot-(bot-top)*p/100}" y2="${bot-(bot-top)*p/100}"/>`).join('')}</svg>
      <div class="hyd-info"><div class="big">${fmtL(total)}</div>
        <p class="sub" style="color:var(--muted);margin:2px 0 8px">${total>=waterGoal()?'Goal reached':fmtL(left)+' remaining'} · goal ${fmtL(waterGoal())}</p>
        <div class="row" style="gap:8px;margin-bottom:6px"><b style="font-size:1.15rem">${pct}%</b><div style="flex:1">${waterBar(pct)}</div></div>
        <div class="row" style="gap:6px;margin:12px 0 8px"><button class="small" data-act="addwater" data-hi="${i}" data-ml="250">+250 ml</button><button class="small" data-act="addwater" data-hi="${i}" data-ml="500">+500 ml</button><button class="small" data-act="addwater" data-hi="${i}" data-ml="800">+800 ml</button></div>
        <div class="row" style="gap:6px"><input type="number" id="waterCustom" min="1" max="5000" step="10" placeholder="Custom ml" aria-label="Custom amount in ml" style="width:116px;margin:0"><button class="small ghost" data-act="addwater" data-hi="${i}" data-custom="1">Add</button></div></div></div>
    ${list.length?`<ul class="hyd-list">${list.map((e,k)=>`<li><span class="na">${new Date(e.t||Date.now()).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span><input type="number" min="1" max="10000" step="10" data-b="hydration.days.${id}.${k}.ml" data-t="number" value="${esc(e.ml)}" aria-label="Amount in ml"><span class="na">ml</span><button class="x" data-act="rmwater" data-hi="${i}" data-i="${k}" aria-label="Remove entry">×</button></li>`).join('')}</ul>`:'<p class="na" style="margin:12px 0 0">No water logged for this day yet.</p>'}</div>`;
}
const waterBar=p=>`<div class="bar water-bar" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div>`;
function animateBottle(){ const w=document.querySelector('.water'); if(!w) return; const to=w.dataset.y; requestAnimationFrame(()=>requestAnimationFrame(()=>w.style.setProperty('--y',to+'px'))); }

    top=`<div class="dash-head"><div><h2>Today</h2><div class="sub">Week ${tw0+1} · Day ${td.dayNumber} of 28 · ${td.weekday}</div></div>${carbPill(td)}</div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">
    <div class="card"><div class="row"><h3>Nutrition</h3><span class="spacer"></span><button class="small ghost" data-act="gotoday" data-w="${tw0}" data-d="${td0}">Open day</button></div>
      <div class="big">${r1(tc.consumed.kcal)} <small style="font-weight:400;color:var(--muted);font-size:.85rem;letter-spacing:0">of ${r1(tc.planned.kcal)} kcal</small></div>
      <div style="margin:10px 0 4px">${barHtml(tc.consumed.kcal,tc.planned.kcal)}</div>
      <p class="sub" style="color:var(--muted);margin:0 0 16px">${r1(tc.remaining.kcal)} kcal remaining · ${tc.mealsDone}/${tc.mealsTotal} meals · iced coffee ${cof?'done':'not yet'}</p>
      <div class="grid g2" style="gap:0 24px">${NUT.slice(1).map(n=>macroLine(n,tc)).join('')}</div></div>
    <div class="card"><div class="row"><h3>Workout</h3><span class="spacer"></span><button class="small ghost" data-act="gotowork" data-w="${tw0}" data-d="${td0}">Open workouts</button></div>
      <div class="big">${tw.done}/${tw.total} <small style="font-weight:400;color:var(--muted);font-size:.85rem;letter-spacing:0">exercises</small></div>
      <div style="margin:10px 0 4px">${barHtml(tw.done,tw.total)}</div>
      <p class="sub" style="color:var(--muted);margin:0 0 12px">${tw.min} of ${tw.pmin} min · ${tw.kcal} of ${tw.pkcal} kcal burned (est.)</p>
      ${todayW&&todayW.exercises.length?`<ul class="ex-list">${todayW.exercises.map(e=>`<li><span>${esc(e.name||'Untitled')}</span><span class="${e.done?'d':''}">${e.done?'Done':`${+e.min||0} min`}</span></li>`).join('')}</ul>`:'<p class="sub" style="color:var(--muted)">Nothing planned for today.</p>'}</div>
  ${hydrationCard()}</div>`;
  }
  return `${top}
  ${weightCard()}
  <div class="card"><div class="row"><h3>28-day plan</h3><span class="spacer"></span><span class="pill">${pct(all.done,all.total)}% of meals complete</span></div>
    <div class="month">${PLAN_DAYS.map((d,i)=>{ const c=dayCalc(d); const st=c.done===c.total?'full':c.done>0?'part':'none'; return `
      <button class="mcell ghost ${st} ${i===ti?'today':''}" data-act="gotoday" data-w="${Math.floor(i/7)}" data-d="${i%7}" title="Day ${d.dayNumber} ${d.weekday} · ${d.carbType} carb · ${c.done}/${c.total}">
        <small>Day ${d.dayNumber}</small><b>${esc(d.weekday.slice(0,3))}</b><i class="carb-${d.carbType.toLowerCase()}"></i><em>${c.done}/${c.total}</em></button>`}).join('')}</div>
    <div class="row" style="justify-content:space-between;color:var(--muted);font-size:.8rem">
      <span>Meals ${all.mDone}/${all.mTot} · Iced coffee tracked separately · Workouts ${MW.done}/${MW.total} (${MW.min} min, ${MW.kcal} kcal)</span>
      <span><span class="legend full"></span>Complete<span class="legend part"></span>Partial<span class="legend"></span>Not started</span></div>

function macroLine(n,c){
  const miss=c.missing[n.k];
  return `<div class="macro"><div class="row"><span>${n.label}</span><span>${r1(c.consumed[n.k])} / ${r1(c.planned[n.k])} ${n.unit}${miss?` <span class="star" title="${miss} food item(s) have no ${n.label.toLowerCase()} value in the PDF">*</span>`:''}</span></div>${barHtml(c.consumed[n.k],c.planned[n.k])}</div>`;
}
const carbPill = d => `<span class="pill carb-${d.carbType.toLowerCase()}">${d.carbType} carb</span>`;
const nv = x => x==null ? '<span class="na" title="Not specified in the PDF">n/a</span>' : r1(x);

  return `<div class="meal ${done?'done':''}">
    <div class="meal-h"><input type="checkbox" data-b="nutriDone.${id}" data-t="check" ${done?'checked':''} aria-label="${esc(e.name)} completed">
      <h3>${esc(e.name)}</h3><span class="pill">${r1(t.t.kcal)} kcal</span>${isCoffee?'<span class="pill">tracked separately</span>':''}${done?'<span class="pill ok">✓ Completed</span>':''}</div>
    <div class="scroll"><table class="ro"><thead><tr><th>Food</th><th>Quantity</th><th>kcal</th><th>P</th><th>C</th><th>F</th><th>Fiber</th></tr></thead><tbody>
    ${e.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${esc(i.quantity)}</td><td>${nv(i.kcal)}</td><td>${nv(i.p)}</td><td>${nv(i.c)}</td><td>${nv(i.f)}</td><td>${nv(i.fiber)}</td></tr>`).join('')}

  </div>`;
}

/* ---------- Supabase authentication (real login; the role comes from public.profiles, enforced by RLS) ---------- */
const SBC=window.SUPABASE_CONFIG||{};
const SB_READY=!!(window.supabase&&SBC.url&&SBC.publishableKey&&!/PASTE_/i.test(SBC.publishableKey));
const mkClient=(persist,key)=>window.supabase.createClient(SBC.url,SBC.publishableKey,{auth:{persistSession:persist,autoRefreshToken:persist,detectSessionInUrl:false,storageKey:key}});
const AUTH={ready:false,error:'',switching:false};
const lsGet=k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } }, lsSet=(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} };
// Two Supabase Auth sessions can be signed in at once (Admin + Doda), each in its own storage key. Switching just changes which client is active:
// no password is ever stored, nothing bypasses Supabase Auth or RLS, and "Logout" signs out of both.
const sbClients=SB_READY?['cc.auth','cc.auth.alt'].map(k=>mkClient(true,k)):[];
let sb=null, sbAlt=null; const ALT={ready:false,role:null,uid:null};
if(SB_READY){ const ak=lsGet('cc.activeAuth')==='cc.auth.alt'?1:0; sb=sbClients[ak]; sbAlt=sbClients[1-ak]; }
function swapClients(){ [sb,sbAlt]=[sbAlt,sb]; lsSet('cc.activeAuth',sb===sbClients[1]?'cc.auth.alt':'cc.auth'); }
const hints=()=>{ try{ return JSON.parse(lsGet('cc.emailHints')||'{}'); }catch(e){ return {}; } };
function rememberLogin(role,email,uid){ const h=hints(); h[role]=email; lsSet('cc.emailHints',JSON.stringify(h)); lsSet('cc.lastEmail',email); lsSet('cc.roleCache',JSON.stringify({uid,role})); }
async function fetchRole(client,uid){ const {data,error}=await client.from('profiles').select('role').eq('id',uid).maybeSingle(); if(error) return {error}; return {role:data&&ROLE_OF[data.role]?data.role:null}; }
async function refreshAlt(){   // is the other account still signed in (and really the other role)?
  ALT.ready=false; ALT.role=null; ALT.uid=null; if(!sbAlt||!SESSION) return;
  try{ const {data:{session}}=await sbAlt.auth.getSession(); if(!session) return; const r=await fetchRole(sbAlt,session.user.id);
    if(r.role&&r.role!==SESSION){ ALT.ready=true; ALT.role=r.role; ALT.uid=session.user.id; }
    else if(r.role||!r.error){ await sbAlt.auth.signOut({scope:'local'}); } }catch(e){} }
async function performSwitch(){   // ALT holds a verified session for the other account
  if(!(await confirmLeave('Switch'))) return false;             // pending edits are pushed first, or the user is warned
  const cur=(await sb.auth.getSession()).data.session, prevUid=cur&&cur.user.id, prevRole=SESSION, target=ALT.role;
  AUTH.switching=true;
  try{ if(SYNC_ENABLED){ cloudStop(); cloudWipeMemory(); }   // the leaving account's cache stays under ITS OWN key (both are signed in on this device); logout wipes both
    swapClients(); SESSION=target; ALT.role=prevRole; ALT.uid=prevUid; ALT.ready=true;
    const now=(await sb.auth.getSession()).data.session; rememberLogin(target,now.user.email,now.user.id);
    if(SYNC_ENABLED) await cloudStart(now.user.id);
  }finally{ AUTH.switching=false; }
  menuOpen=false; resetUi(); syncToToday(); render(); window.scrollTo(0,0); toast('Switched to '+(target==='admin'?'Admin':'Doda')); return true; }
async function startSwitch(){   // one click when the other account is still signed in, otherwise sign in to it once
  if(ALT.ready){ try{ const {data:{session}}=await sbAlt.auth.getSession(); if(session&&session.user.id===ALT.uid){ await performSwitch(); return; } }catch(e){} ALT.ready=false; }
  openSwitch(); }
async function bootAuth(){
  if(sb){ try{
      let {data:{session}}=await sb.auth.getSession();
      if(!session){ const o=await sbAlt.auth.getSession(); if(o.data.session){ swapClients(); session=o.data.session; } }   // only the other account's session survived
      if(session){ const r=await fetchRole(sb,session.user.id);
        if(r.role){ SESSION=r.role; lsSet('cc.roleCache',JSON.stringify({uid:session.user.id,role:r.role})); if(SYNC_ENABLED) await cloudStart(session.user.id); }
        else if(r.error){ let c=null; try{ c=JSON.parse(lsGet('cc.roleCache')||'null'); }catch(e){} if(c&&c.uid===session.user.id&&ROLE_OF[c.role]){ SESSION=c.role; if(SYNC_ENABLED) await cloudStart(session.user.id); } }   // offline: last verified role (data is still protected by RLS)
        else { await sb.auth.signOut({scope:'local'}); AUTH.error='This account has no access to the app.'; } }
      await refreshAlt();
      sbClients.forEach(c=>c.auth.onAuthStateChange(ev=>{ if(ev!=='SIGNED_OUT'||AUTH.switching) return; if(c!==sb){ ALT.ready=false; if(SESSION) render(); return; } if(SESSION){ SESSION=null; menuOpen=false; if(SYNC_ENABLED){ const uid=SYNC.uid, keep=unsyncedInfo().pend; cloudStop(); cloudWipeMemory(); if(!keep) purgeCloudCaches(uid); } resetUi(); render(); } }));   // e.g. signed out in another tab (unsynced edits stay in that account's own cache until it signs in again)
    }catch(e){ console.error('auth boot failed',e); } }
  AUTH.ready=true; if(SESSION) syncToToday(); render();
}
async function doLogout(){ if(!(await confirmLeave('Log out'))) return; const uid=SYNC.uid; AUTH.switching=true; try{ if(sb) await sb.auth.signOut({scope:'local'}); }catch(e){} try{ if(sbAlt) await sbAlt.auth.signOut({scope:'local'}); }catch(e){} AUTH.switching=false; ALT.ready=false; ALT.role=null; ALT.uid=null; SESSION=null; menuOpen=false; if(SYNC_ENABLED){ cloudStop(); cloudWipeMemory(); purgeCloudCaches('*'); } resetUi(); render(); }
document.addEventListener('submit', async e=>{ if(e.target.id!=='loginForm') return; e.preventDefault();
  const email=document.getElementById('loginEmail').value.trim(), pw=document.getElementById('loginPass').value, err=document.getElementById('loginErr'), btn=document.getElementById('loginBtn');
  if(!sb){ err.textContent='Sign-in isn’t configured yet.'; return; }
  btn.disabled=true; err.textContent='';
  const {data,error}=await sb.auth.signInWithPassword({email,password:pw});
  if(error||!data||!data.session){ err.textContent='Invalid email or password.'; btn.disabled=false; return; }
  const r=await fetchRole(sb,data.session.user.id);
  if(!r.role){ await sb.auth.signOut({scope:'local'}); err.textContent=r.error?'Couldn’t verify your account. Please try again.':'This account has no access to the app.'; btn.disabled=false; return; }
  SESSION=r.role; AUTH.error=''; rememberLogin(r.role,email,data.session.user.id); menuOpen=false; await refreshAlt(); if(SYNC_ENABLED) await cloudStart(data.session.user.id); resetUi(); syncToToday(); render(); });

function openSwitch(){   // first-time sign-in to the other account (its own credentials; afterwards switching is one click)
  if(!sb||document.querySelector('.cropm')) return;
  const target=SESSION==='doda'?'admin':'doda', label=target==='admin'?'Admin':'Doda';
  const m=document.createElement('div'); m.className='cropm'; m.setAttribute('role','dialog'); m.setAttribute('aria-modal','true'); m.setAttribute('aria-label','Switch to '+label);
  m.innerHTML=`<form class="cropc" id="swForm" autocomplete="on"><h3>Switch to ${label}</h3><p class="na" style="margin:4px 0 12px">Enter the ${label} account’s email and password.</p>

    <p class="login-err" id="swErr" role="alert" style="text-align:left"></p>
    <div class="cropb"><span class="spacer"></span><button type="button" class="ghost" id="swCancel">Cancel</button><button type="submit" id="swGo">Switch</button></div></form>`;
  document.body.appendChild(m);
  const close=()=>{ document.removeEventListener('keydown',onKey); m.remove(); }, onKey=ev=>{ if(ev.key==='Escape') close(); };
  document.addEventListener('keydown',onKey); m.querySelector('#swCancel').onclick=close; m.addEventListener('pointerdown',ev=>{ if(ev.target===m) close(); });
  (m.querySelector('#swEmail').value?m.querySelector('#swPass'):m.querySelector('#swEmail')).focus();
  m.querySelector('#swForm').onsubmit=async ev=>{ ev.preventDefault();

    // the other account signs in on its own client, so the current session is never disturbed and later switches are one click
    const {data,error}=await sbAlt.auth.signInWithPassword({email,password:pw});
    if(error||!data||!data.session){ err.textContent=(error&&(error.status===0||/fetch|network/i.test(String(error.name)+String(error.message))))?'You’re offline — reconnect to switch accounts.':'Invalid email or password.'; go.disabled=false; m.querySelector('#swPass').value=''; return; }
    const r=await fetchRole(sbAlt,data.session.user.id);
    if(r.role!==target){ await sbAlt.auth.signOut({scope:'local'}); err.textContent=r.role?`That account isn’t ${label}.`:'This account has no access to the app.'; go.disabled=false; m.querySelector('#swPass').value=''; return; }
    ALT.ready=true; ALT.role=target; ALT.uid=data.session.user.id; close();
    await performSwitch(); };

let toastBox; const TOAST_MAX=4;
function toast(msg, type='ok'){   // all notifications: top centre, stacked (never overlapping), identical ones just extend
  if(!toastBox){ toastBox=document.createElement('div'); toastBox.id='toasts'; toastBox.setAttribute('role','status'); toastBox.setAttribute('aria-live','polite'); document.body.appendChild(toastBox); }
  const kind=type==='error'?'err':type==='undo'?'undo':type==='warn'?'warn':'';
  const dupe=[...toastBox.children].find(t=>t.dataset.msg===msg&&t.dataset.type===type&&!t.dataset.gone);
  const kill=el=>{ el.dataset.gone='1'; el.classList.remove('show'); setTimeout(()=>el.remove(),260); };
  const life=el=>{ clearTimeout(el._t); el._t=setTimeout(()=>kill(el), type==='error'||type==='warn'?4500:2400); };
  if(dupe){ life(dupe); return; }
  const el=document.createElement('div'); el.className='toast'+(kind?' '+kind:''); el.dataset.msg=msg; el.dataset.type=type;
  el.innerHTML=`<span class="ti">${type==='error'||type==='warn'?'!':type==='undo'?'↩':'✓'}</span><span>${esc(msg)}</span>`;
  toastBox.appendChild(el); void el.offsetWidth; el.classList.add('show'); life(el);
  const live=[...toastBox.children].filter(t=>!t.dataset.gone); while(live.length>TOAST_MAX) kill(live.shift());
}

/* ---------- validation ---------- */
function validate(el, path, t, v){
  const key=path.split('.').pop();
  if(/^hydration\.days\.[^.]+\.\d+\.ml$/.test(path)) return (Number.isFinite(v)&&v>=1&&v<=10000)?null:'Enter an amount between 1 and 10000 ml';
  if((t==='date'||path==='planStart')&&v){ const y=+String(v).slice(0,4); if(!(y>=1900&&y<=2100)) return 'Enter a valid year (1900–2100)'; }
  if(/^weight\.entries\.\d+\.date$/.test(path)){ if(!v) return 'Enter a date'; const d=new Date(v+'T00:00:00'); if(isNaN(d)) return 'Enter a valid date'; if(d>new Date()) return 'Date can’t be in the future'; return null; }
  if(/^weight\.entries\.\d+\.kg$/.test(path)) return (Number.isFinite(v)&&v>=20&&v<=500)?null:'Weight must be between 20 and 500 kg';
  if(/^weight\.(start|goal)$/.test(path)) return (v===null||(Number.isFinite(v)&&v>=20&&v<=500))?null:'Weight must be between 20 and 500 kg';
  if(t==='qty') return (Number.isFinite(v)&&v>=0&&v<=100000)?null:(v<0?'Quantity can’t be negative':'Enter a valid quantity');
  if(t==='food') return foodsFor(mealKeyOfPath(path)).some(x=>x.id===v)?null:'That food isn’t in this meal’s category';
  if(t==='exercise') return CAT.exercises.some(x=>x.id===v)?null:'Choose an item from the catalog';
  if(/^catalog\.targets\./.test(path)) return (v===null||(Number.isFinite(v)&&v>=0&&v<=100000))?null:'Enter a value of 0 or more';
  const fm=path.match(/^catalog\.foods\.\d+\.(baseQty|kcal|p|c|f|fiber)$/); if(fm){ if(fm[1]==='baseQty') return (v>0&&v<=100000)?null:'Base quantity must be greater than 0'; return (v===null||(Number.isFinite(v)&&v>=0&&v<=100000))?null:'Enter a value of 0 or more'; }
  if(/^catalog\.foods\.\d+\.unit$/.test(path)) return UNITS.includes(v)?null:'Choose a valid unit';
  const em=path.match(/^catalog\.exercises\.\d+\.(min|kcal)$/); if(em) return (Number.isFinite(v)&&v>=0&&v<=(em[1]==='min'?1440:100000))?null:'Enter a valid number';
  const cm=path.match(/^catalog\.(foods|exercises|videos)\.(\d+)\.(name|title|url)$/);
  if(cm){ if(cm[3]==='url') return /^https?:\/\/\S+$/i.test(v.trim())?null:'Video link must start with http:// or https://';
    const n=v.trim(); if(!n) return 'Name can’t be empty'; if(n.length>120) return 'Name is too long';
    if(CAT[cm[1]].some((x,i)=>i!==+cm[2]&&String(x.name??x.title).trim().toLowerCase()===n.toLowerCase())) return 'That name already exists'; return null; }
  if(t==='number'||t==='nnum'){
    if(v===null) return null;
    if(!Number.isFinite(v)) return 'Enter a valid number';
    if(v<0) return 'Value can’t be negative';
    if(key==='min' && v>1440) return 'Duration can’t exceed 1440 minutes';
    if(v>100000) return 'Value is too large';
    if(path==='profile.weight' && v!==0 && (v<20||v>500)) return 'Weight must be between 20 and 500 kg';
    if(path==='profile.height' && v!==0 && (v<80||v>260)) return 'Height must be between 80 and 260 cm';
  } else if(t==='url'){
    if(v!=='' && !/^https?:\/\/\S+$/i.test(v.trim())) return 'Link must start with http:// or https://';
  } else if(t==='date'||path==='planStart'){
    if(v!==''){ const d=new Date(v+'T00:00:00'); if(isNaN(d)) return 'Enter a valid date'; if(path==='profile.birthday' && d>new Date()) return 'Birthday can’t be in the future'; }
  } else if(t==='text' && typeof v==='string'){
    if(v.length>(el.tagName==='TEXTAREA'?2000:200)) return 'Text is too long';
  }
  return null;
}

  else if(a==='gotoday'){ if(role()!=='user') return; S.ui.tab='nutrition'; S.ui.nw=+d.w; S.ui.nd=+d.d; }
  else if(a==='syncretry'){ if(SYNC.on){ SYNC.fail=0; runSync(); } return; }
  else if(a==='logout'){ doLogout(); return; }
  else if(a==='switch'){ menuOpen=false; render(); startSwitch(); return; }
  else if(a==='addcat'){ if(role()!=='admin') return; const k=d.k, list=CAT[k], base={foods:'New food',exercises:'New exercise',videos:'New video'}[k], f=k==='videos'?'title':'name';
    let n=base,i=2; while(list.some(x=>String(x[f]).toLowerCase()===n.toLowerCase())) n=base+' '+(i++);
    list.push(k==='videos'?{id:genId('v_'),title:n,url:'',type:'Other'}:k==='foods'?{id:genId('f_'),name:n,baseQty:100,unit:'g',kcal:0,p:0,c:0,f:0,fiber:0,cats:[]}:{id:genId('e_'),name:n,int:'Moderate',min:0,kcal:0,videoId:''}); }
  else if(a==='togcat'){ if(role()!=='admin') return; const f=CAT.foods[+d.i]; f.cats=f.cats||[]; const ix=f.cats.indexOf(d.c); if(ix>=0) f.cats.splice(ix,1); else f.cats.push(d.c);
    const ok=saveCat(); toast(ok?'Changes saved':SAVE_FAIL, ok?'ok':'error'); render(); window.scrollTo(0,sc); return; }
  else if(a==='delcat'){ if(role()!=='admin') return; const k=d.k, it=CAT[k][+d.i], n=usage[k](it.id), lab=it.name||it.title;
    if(!confirm(n?`“${lab}” is used in ${n} place${n>1?'s':''}. Delete it anyway? Those entries keep their current name but lose the catalog link.`:`Delete “${lab}”?`)) return;
    CAT[k].splice(+d.i,1);
    if(k==='foods') itemsOf().forEach(i=>{ if(i.foodId===it.id) i.foodId=null; });
    if(k==='exercises') exercisesOf().forEach(({e})=>{ if(e.exId===it.id) e.exId=null; });
    if(k==='videos') exercisesOf().forEach(({e})=>{ if(e.videoId===it.id) e.videoId=''; });
    const ok=persist(true,true); toast(ok?'Changes saved':SAVE_FAIL, ok?'ok':'error'); render(); return; }
  else if(a==='unlink'){ if(role()!=='user') return; S.workouts.weeks[+d.w].days[+d.d].exercises[+d.i].videoId=''; }
  else if(a==='gotoprofile'){ if(role()!=='user') return; S.ui.tab='profile'; scrollTarget='planstart'; }
  else if(a==='hydday'){ if(role()!=='user') return; S.ui.hd=Math.min(PLAN_DAYS.length-1,Math.max(0,hydDay()+(+d.dir))); }
  else if(a==='addwater'){ if(role()!=='user') return; const i=d.hi!==undefined?+d.hi:hydDay(), id=hydId(i);
    const ml=d.custom?parseFloat(document.getElementById('waterCustom').value):parseFloat(d.ml);
    if(!(ml>=1&&ml<=5000)){ toast('Enter an amount between 1 and 5000 ml','error'); return; }
    const before=hydTotal(i); (S.hydration.days[id]=S.hydration.days[id]||[]).push({id:genId('h_'),ml:Math.round(ml),t:Date.now()});
    if(persist(false)){ toast('Water saved'); if(before<waterGoal()&&hydTotal(i)>=waterGoal()) celebrate('water'); } else toast(SAVE_FAIL,'error'); render(); window.scrollTo(0,sc); return; }
  else if(a==='rmwater'){ if(role()!=='user') return; const i=d.hi!==undefined?+d.hi:hydDay(), id=hydId(i); (S.hydration.days[id]||[]).splice(+d.i,1); if(!(S.hydration.days[id]||[]).length) delete S.hydration.days[id];
    toast(persist(false)?'Water saved':SAVE_FAIL, 'ok'); render(); window.scrollTo(0,sc); return; }
  else if(a==='gotoweight'){ if(role()!=='user') return; S.ui.tab='profile'; scrollTarget='weight'; }
  else if(a==='addweight'){ if(role()!=='user') return; const dt=document.getElementById('wDate').value, k=parseFloat(document.getElementById('wKg').value);
    const err=!dt||isNaN(new Date(dt+'T00:00:00'))?'Enter a date':new Date(dt+'T00:00:00')>new Date()?'Date can’t be in the future':!(k>=20&&k<=500)?'Weight must be between 20 and 500 kg':null;
    if(err){ toast(err,'error'); return; } S.weight.entries.push({id:genId('w_'),date:dt,kg:k}); }
  else if(a==='theme') S.theme=S.theme==='dark'?'light':'dark';
  else if(a==='home'){ if(role()==='user') S.ui.tab='dashboard'; requestAnimationFrame(()=>window.scrollTo(0,0)); }
  else if(a==='add') get(d.path).push(TPL[d.tpl]());
  else if(a==='del'){ if(!confirm('Remove this?')) return; const gone=get(d.path).splice(+d.i,1)[0];
    if(gone&&gone.id) delete S.nutriDone[gone.id];                       // removed meal: drop its completion flag
    if(d.path==='videos') S.workouts.weeks.forEach(wk=>wk.days.forEach(dy=>dy.exercises.forEach(x=>{ if(x.video!==''&&x.video!=null){ if(+x.video===+d.i) x.video=''; else if(+x.video>+d.i) x.video=+x.video-1; } }))); }
  else if(a==='resetplan'){ if(!confirm('Discard all nutrition edits and restore the PDF plan?')) return; try{ if(SYNC.enabled){ if(SYNC.uid) localStorage.removeItem(planKey(SYNC.uid)); } else localStorage.removeItem(PLAN_KEY); }catch(x){} save(); location.reload(); return; }
  else if(a==='gotowork'){ if(role()!=='user') return; S.ui.tab='workouts'; S.ui.ww=+d.w; S.ui.wd=+d.d; }
  else if(a==='pickphoto'){ const f=document.getElementById('photo'); if(f) f.click(); return; }
  else if(a==='rmphoto'){ S.profile.photo=''; if(SYNC.on){ photoTrash(S.profile.photoPath); S.profile.photoPath=''; S.profile.photoPending=false; S.profile.photoLoaded=''; } }
  else if(a==='export'){ const bl=new Blob([JSON.stringify(S)],{type:'application/json'}); const l=document.createElement('a'); l.href=URL.createObjectURL(bl); l.download='carb-cycle-plan-backup.json'; l.click(); return; }
  else if(a==='reset'){ if(!confirm('Erase ALL data and start over?')) return; S=migrate(seed()); ensureLinks(); importProgram(); }
  const ok=persist((d.path||'').startsWith('plan.'), a==='addcat');
  if(!ok) toast(SAVE_FAIL,'error'); else if(['add','del','rmphoto','reset','addcat','unlink','addweight'].includes(a)) toast((d.path||'').startsWith('weight.')||a==='addweight'?'Weight saved':'Changes saved');
  render(); window.scrollTo(0,sc);
  if(scrollTarget){ const n=document.getElementById(scrollTarget); if(n) n.scrollIntoView({block:'start'}); scrollTarget=null; }
});

/* ---------- profile photo: crop & zoom modal ---------- */
const PHOTO_MAX_BYTES=30*1024*1024;
function onPhoto(e){
  const input=e.target, f=input.files&&input.files[0]; if(!f) return;
  const reset=()=>{ try{ input.value=''; }catch(_){} };
  if(!/^image\//.test(f.type)){ toast('Please choose an image file','error'); reset(); return; }
  if(f.size>PHOTO_MAX_BYTES){ toast('That image is too large (max 30 MB)','error'); reset(); return; }
  const url=URL.createObjectURL(f), img=new Image();
  img.onload=()=>{ if(!img.naturalWidth||!img.naturalHeight){ URL.revokeObjectURL(url); toast('That image can’t be read','error'); reset(); return; } openCrop(img,url,reset); };
  img.onerror=()=>{ URL.revokeObjectURL(url); toast('That image format isn’t supported — try JPG or PNG','error'); reset(); };
  img.src=url;
}
function openCrop(img,url,done){
  const W=img.naturalWidth,H=img.naturalHeight; let z=1,cx=W/2,cy=H/2,V=280,cover=1;
  const m=document.createElement('div'); m.className='cropm'; m.setAttribute('role','dialog'); m.setAttribute('aria-modal','true'); m.setAttribute('aria-label','Crop profile photo');
  m.innerHTML=`<div class="cropc"><h3>Adjust photo</h3><p class="na" style="margin:4px 0 0">Drag to reposition · pinch or use the slider to zoom</p>
    <div class="cropv" id="cropV"></div>
    <div class="cropz"><span class="na">−</span><input type="range" id="cropZ" min="1" max="4" step="0.01" value="1" aria-label="Zoom"><span class="na">+</span></div>
    <div class="cropb"><button class="ghost small" id="cropReset">Reset</button><span class="spacer"></span><button class="ghost" id="cropCancel">Cancel</button><button id="cropSave">Save photo</button></div></div>`;
  document.body.appendChild(m);
  const box=m.querySelector('#cropV'), slider=m.querySelector('#cropZ'); img.draggable=false; box.appendChild(img);
  const clamp=()=>{ const sw=V/(cover*z); cx=Math.min(W-sw/2,Math.max(sw/2,cx)); cy=Math.min(H-sw/2,Math.max(sw/2,cy)); };
  const paint=()=>{ clamp(); const k=cover*z; img.style.width=(W*k)+'px'; img.style.height=(H*k)+'px'; img.style.left=(V/2-cx*k)+'px'; img.style.top=(V/2-cy*k)+'px'; slider.value=z; };
  const fit=()=>{ V=box.clientWidth; cover=Math.max(V/W,V/H); paint(); }; fit();
  const reset=()=>{ z=1; cx=W/2; cy=H/2; paint(); };
  const setZoom=nz=>{ z=Math.min(4,Math.max(1,nz)); paint(); };
  slider.addEventListener('input',()=>setZoom(parseFloat(slider.value)));
  box.addEventListener('wheel',ev=>{ ev.preventDefault(); setZoom(z*(ev.deltaY<0?1.06:1/1.06)); },{passive:false});
  const ptr=new Map(); let lastD=0;
  box.addEventListener('pointerdown',ev=>{ box.setPointerCapture(ev.pointerId); ptr.set(ev.pointerId,{x:ev.clientX,y:ev.clientY}); box.classList.add('grab'); if(ptr.size===2){ const [a,b]=[...ptr.values()]; lastD=Math.hypot(a.x-b.x,a.y-b.y); } });
  box.addEventListener('pointermove',ev=>{ const p=ptr.get(ev.pointerId); if(!p) return;
    if(ptr.size===2){ ptr.set(ev.pointerId,{x:ev.clientX,y:ev.clientY}); const [a,b]=[...ptr.values()], d=Math.hypot(a.x-b.x,a.y-b.y); if(lastD>0) setZoom(z*d/lastD); lastD=d; return; }
    const k=cover*z; cx-=(ev.clientX-p.x)/k; cy-=(ev.clientY-p.y)/k; ptr.set(ev.pointerId,{x:ev.clientX,y:ev.clientY}); paint(); });
  const up=ev=>{ ptr.delete(ev.pointerId); lastD=0; if(!ptr.size) box.classList.remove('grab'); };
  box.addEventListener('pointerup',up); box.addEventListener('pointercancel',up);
  const close=()=>{ document.removeEventListener('keydown',onKey); window.removeEventListener('resize',fit); m.remove(); URL.revokeObjectURL(url); done(); };
  const onKey=ev=>{ if(ev.key==='Escape') close(); };
  document.addEventListener('keydown',onKey); window.addEventListener('resize',fit);
  m.querySelector('#cropReset').onclick=reset; m.querySelector('#cropCancel').onclick=close;
  m.addEventListener('pointerdown',ev=>{ if(ev.target===m) close(); });
  m.querySelector('#cropSave').onclick=()=>{
    clamp(); const out=400, sw=V/(cover*z), c=document.createElement('canvas'); c.width=c.height=out; const g=c.getContext('2d'); g.imageSmoothingQuality='high';
    g.fillStyle='#fff'; g.fillRect(0,0,out,out); g.drawImage(img,cx-sw/2,cy-sw/2,sw,sw,0,0,out,out);
    let q=.88, data=c.toDataURL('image/jpeg',q); while(data.length>180000&&q>.6){ q-=.08; data=c.toDataURL('image/jpeg',q); }   // keep it light for localStorage
    const prev=S.profile.photo, prevPend=S.profile.photoPending; S.profile.photo=data; if(SYNC.on) S.profile.photoPending=true;
    if(save()){ toast('Profile photo updated'); close(); render(); } else { S.profile.photo=prev; S.profile.photoPending=prevPend; toast(SAVE_FAIL,'error'); }
  };
  m.querySelector('#cropSave').focus();
}
function onImport(e){
  const f=e.target.files[0]; if(!f) return; const rd=new FileReader();
  rd.onload=()=>{ try{ const o=JSON.parse(rd.result); if(!o.workouts||!o.profile) throw 0; S=migrate(o); if(save()) toast('Backup imported'); else toast(SAVE_FAIL,'error'); render(); }catch(x){ toast('That file is not a valid backup','error'); } };
  rd.readAsText(f);
}

bootAuth();
