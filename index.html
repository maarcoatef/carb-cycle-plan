<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pretty Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F5F2; --card:#FFFFFF; --ink:#1F1D1B; --muted:#6B6760; --accent:#8A5A4D; --accent-soft:#F3ECE8;
  --soft:#F1EFEB; --line:#E7E4DE; --field:#FFFFFF; --on:#FFFFFF; --ok:#4F7F63; --ok-soft:#E7F0EA;
  --wm-op:.05; --shadow:0 1px 2px #1f1d1b0a; --r:14px; --r-sm:8px;
  --low:#EDEAE4; --mod:#F1E7D3; --high:#F0DDD6; --bar:#E9E6E0;
}
:root[data-theme="dark"]{
  --bg:#131211; --card:#1B1A18; --ink:#EDEAE6; --muted:#A29D95; --accent:#D8A798; --accent-soft:#2A2321;
  --soft:#22201E; --line:#2D2A27; --field:#161514; --on:#1A1210; --ok:#7FB596; --ok-soft:#1F2A24;
  --shadow:none; --wm-op:.045;
  --low:#26231F; --mod:#2E2819; --high:#33241F; --bar:#2B2926;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.5;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
body::before,body::after{content:"";position:fixed;pointer-events:none;z-index:0;background-repeat:no-repeat;background-size:contain;opacity:var(--wm-op,.045)}
body::before{right:-70px;bottom:-60px;width:520px;height:780px;background-image:var(--wm1);background-position:bottom right}
body::after{left:-110px;top:70px;width:380px;height:570px;background-image:var(--wm2);transform:rotate(-8deg);opacity:calc(var(--wm-op,.045)*.8)}
#app{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:0 20px 48px}
h1,h2,h3{font-weight:600;color:var(--ink);margin:0;letter-spacing:-.01em}
h2{font-size:1.25rem}
h3{font-size:.95rem}
main>h2{margin:20px 0 14px}
p{margin:.4em 0}
small{font-size:.78rem}
a{color:var(--accent);text-decoration:none;font-weight:500}a:hover{text-decoration:underline}
/* header */
header.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;position:sticky;top:0;z-index:6;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;justify-self:start;font-weight:600;letter-spacing:-.01em}
.brand .logo{width:30px;height:30px;color:var(--accent)}
nav{display:flex;gap:2px;justify-self:center}
nav button{background:transparent;color:var(--muted);border:0;border-radius:var(--r-sm);padding:7px 14px;font-weight:500;box-shadow:none}
nav button:hover{color:var(--ink);background:var(--soft)}
nav button.on{color:var(--ink);background:var(--soft);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}
.top-actions{display:flex;align-items:center;gap:10px;justify-self:end}
.avatar-btn{width:36px;height:36px;padding:0;border-radius:50%;overflow:hidden;background:var(--accent-soft);color:var(--accent);border:1px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:600}
.avatar-btn img{width:100%;height:100%;object-fit:cover;display:block}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:44px;min-width:150px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);box-shadow:0 8px 24px #00000022;padding:4px;z-index:20;display:flex;flex-direction:column}
.menu button{background:transparent;color:var(--ink);text-align:left;border:0;padding:8px 12px;border-radius:6px;font-weight:500}
.menu button:hover{background:var(--soft)}.menu button.on{color:var(--accent);font-weight:600}
.at{min-width:780px;table-layout:fixed}
.at th:nth-child(1){width:28%}.at th:nth-child(2){width:17%}.at th:nth-child(n+3):nth-child(-n+7){width:9%}.at th:nth-child(8){width:84px}
.at td{padding:5px}
.at td input{margin:0;background:transparent;border-color:transparent;padding:5px 7px}
.at td input:hover{border-color:var(--line)}.at td input:focus{background:var(--field);border-color:var(--accent)}
.at td:nth-child(n+3):nth-child(-n+7) input,.at th:nth-child(n+3):nth-child(-n+7){text-align:right}
.at tfoot td{font-weight:600;background:var(--soft);border-top:1px solid var(--line);border-bottom:0;font-size:.8rem;letter-spacing:.04em}
.at tfoot td:nth-child(n+3){text-align:right}
.wt.rot td{padding:9px 8px}.wt.rot td.c-name{white-space:normal}.wt.rot td.c-num{text-align:right}.wt.rot td.c-notes{white-space:normal;color:var(--muted)}
.avatar-btn.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
/* controls */
button,select,input,textarea{font:inherit;color:var(--ink)}
button{cursor:pointer;border:1px solid transparent;border-radius:var(--r-sm);padding:7px 14px;background:var(--accent);color:var(--on);font-weight:500}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
button.ghost:hover{background:var(--soft)}
button.small{padding:4px 10px;font-size:.8rem}
button.x{background:transparent;color:var(--muted);border:0;padding:2px 8px;font-size:1.1rem;line-height:1}
button.x:hover{color:var(--ink)}
label{display:block;font-size:.75rem;color:var(--muted);font-weight:500}
input,select,textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 10px;margin-top:4px}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);margin:0;flex:none}
textarea{min-height:64px;resize:vertical}
/* layout */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.card>h3:first-child,.card>.row:first-child{margin-bottom:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.quote{color:var(--muted);font-size:.85rem;margin:16px 0 0}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.tabs button{background:transparent;color:var(--muted);border:1px solid transparent;padding:5px 11px;font-weight:500}
.tabs button:hover{background:var(--soft);color:var(--ink)}
.tabs button.on{background:var(--accent-soft);color:var(--accent);border-color:var(--line);font-weight:600}
.tabs .lbl{font-size:.72rem;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;min-width:44px;margin-right:6px}
/* tables */
table{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
th{color:var(--muted);font-size:.7rem;font-weight:500;text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line)}
table.ro th:nth-child(n+3),table.ro td:nth-child(n+3){text-align:right}
table.ro td:first-child{min-width:150px}
table.ro td,table.ro th{white-space:nowrap}
table.ro td:first-child{white-space:normal}
table.ro tbody tr:last-child td{border-bottom:0}
.meal table.ro{table-layout:fixed;min-width:580px}
.meal table.ro th:nth-child(1){width:34%}.meal table.ro th:nth-child(2){width:20%}
.meal table.ro th:nth-child(n+3){width:9.2%}
.meal table.ro td:first-child{min-width:0}
.meal table.ro td:nth-child(2),.meal table.ro th:nth-child(2){text-align:left}
.meal table.ro tfoot td:nth-child(n+2),table.ro tfoot td:nth-child(n+2){text-align:right}
table.ro tfoot td:first-child{text-align:left}
table.ro tfoot td{font-weight:600;color:var(--ink);background:var(--soft);border-top:1px solid var(--line);border-bottom:0;font-size:.8rem;letter-spacing:.04em}
tr.ref td{color:var(--muted);font-size:.8rem}
.na{color:var(--muted);font-size:.8rem}
.scroll{overflow-x:auto;margin:0 -4px;padding:0 4px}
/* components */
.meal,.ex{border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 12px;background:var(--card)}
.meal.done,.ex.done{border-color:var(--ok)}
.meal-h{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.meal-h h3{font-size:.95rem}
.meal-h button{flex:none;white-space:nowrap}
.meal-h input[type=text]{margin:0;font-weight:500}
.bar{height:6px;background:var(--bar);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.bar.ok i{background:var(--ok)}
.stat b{display:block;font-size:1.3rem;font-weight:600;letter-spacing:-.02em}
.stat span{font-size:.75rem;color:var(--muted);font-weight:400}
.stat .bar{margin-top:6px}
.pill{display:inline-block;background:var(--soft);color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:1px 10px;font-size:.72rem;font-weight:500}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.carb-low{background:var(--low)}.pill.carb-moderate{background:var(--mod)}.pill.carb-high{background:var(--high)}
.pill.carb-low,.pill.carb-moderate,.pill.carb-high{color:var(--ink);border-color:transparent}
.macro{margin:0 0 12px}
.macro .row{justify-content:space-between;font-size:.8rem;margin-bottom:5px;gap:6px}
.macro .row span:first-child{color:var(--muted)}
.star{color:var(--muted);cursor:help}
.prog-row{display:grid;grid-template-columns:170px 1fr 1fr 10px;gap:14px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:.85rem}
.prog-row:last-child{border-bottom:0}
.prog-row small{color:var(--muted)}
.vid{display:grid;grid-template-columns:1fr 1fr 130px 1fr auto;gap:12px;align-items:end;padding:12px 0;border-bottom:1px solid var(--line)}
.profile-top{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.big-avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;border:1px solid var(--line);background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:1.8rem;font-weight:600}
/* dashboard */
.dash-head{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin:22px 0 16px}
.dash-head h2{font-size:1.5rem}
.dash-head .sub{color:var(--muted);font-size:.85rem}
.big{font-size:2rem;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:4px 0 14px}
.mcell{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 2px;border-radius:10px;background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:500}
.mcell b{font-size:.8rem}.mcell small,.mcell em{font-size:.68rem;font-style:normal;color:var(--muted)}
.mcell i{display:block;width:40%;height:3px;border-radius:9px;margin:3px 0}
.carb-low{background:var(--low)}.carb-moderate{background:var(--mod)}.carb-high{background:var(--high)}
.mcell.full{background:var(--ok-soft);border-color:var(--ok)}.mcell.part{border-color:var(--accent)}.mcell.today{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--accent)}
.legend{display:inline-block;width:10px;height:10px;border-radius:3px;border:1px solid var(--line);vertical-align:-1px;margin:0 3px 0 10px}.legend.full{border-color:var(--ok);background:var(--ok-soft)}.legend.part{border-color:var(--accent)}
.ex a,label a{font-size:.78rem}
.wt{min-width:900px;table-layout:fixed}
.wt th:nth-child(1){width:54px}.wt th:nth-child(2){width:19%}.wt th:nth-child(3){width:118px}.wt th:nth-child(4),.wt th:nth-child(5){width:100px}.wt th:nth-child(6){width:22%}.wt th:nth-child(8){width:84px}
.wt th{white-space:nowrap}.wt td{vertical-align:middle;padding:6px 6px}
.wt tbody tr:nth-child(odd){background:var(--card)}.wt tbody tr:nth-child(even){background:var(--soft)}
.wt tbody tr.done{background:var(--ok-soft)}
.wt td input:not([type=checkbox]),.wt td select{margin:0;background:transparent;border-color:transparent;padding:5px 7px}
.wt td input:not([type=checkbox]):hover,.wt td select:hover{border-color:var(--line)}
.wt td input:not([type=checkbox]):focus,.wt td select:focus{background:var(--field);border-color:var(--accent)}
.wt td.c-num input{text-align:right}
.wt td.c-done,.wt th:first-child{text-align:center}
.wt tbody tr.done td.c-name input{color:var(--muted)}
.vidcell{display:flex;gap:6px;align-items:center}.vidcell a{font-size:.8rem;white-space:nowrap}
.wt select.lib{font-size:.75rem;color:var(--muted);padding:2px 7px;margin-top:2px}
.wt tfoot td{background:transparent;border-top:1px solid var(--line);font-size:.75rem;color:var(--muted);letter-spacing:.05em}
.wt th:nth-child(1),.wt td:nth-child(1),.wt th:nth-child(2),.wt td:nth-child(2){position:sticky;background:inherit;z-index:1}
.wt th:nth-child(1),.wt td:nth-child(1){left:0}.wt th:nth-child(2),.wt td:nth-child(2){left:54px}
.wt thead th{background:var(--card)}
.wt thead th:nth-child(-n+2){background:var(--card);z-index:2}
.wt tfoot td:nth-child(1),.wt tfoot td:nth-child(2){position:static}
.ex-list{list-style:none;margin:0;padding:0}
.ex-list li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.85rem}
.ex-list li:last-child{border-bottom:0}
.ex-list .d{color:var(--ok)}
@media(max-width:860px){
  header.top{grid-template-columns:auto 1fr;grid-template-areas:"brand actions" "nav nav"}
  .brand{grid-area:brand}.top-actions{grid-area:actions}
  nav{grid-area:nav;justify-self:stretch;overflow-x:auto;justify-content:center}
  nav button{white-space:nowrap}
  nav{scrollbar-width:none}nav::-webkit-scrollbar{display:none}
}
@media(max-width:700px){
  body::before{width:300px;height:450px;right:-60px}
  body::after{display:none}
  #app{padding:0 14px 40px}
  .card{padding:16px}
  .prog-row{grid-template-columns:1fr 1fr}
  .vid{grid-template-columns:1fr}
  .month{gap:5px}
  .brand span{display:none}
  nav button{padding:7px 9px;font-size:.84rem}
  .dash-head h2{font-size:1.25rem}
}
</style>
</head>
<body>
<div id="app"></div>

<script src="data/plan-data.js"></script>
<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const clone = o => JSON.parse(JSON.stringify(o));
const r1 = n => Math.round((+n||0)*10)/10;
const num = s => { const m = String(s ?? '').match(/[\d.]+/g); return m ? parseFloat(m[m.length-1]) : 0; };

const QUOTES = [
  "Small steps every day become big changes.","Progress, not perfection.","Be proud of every healthy choice you make.",
  "Your only competition is who you were yesterday.","Strong is the new pretty.","Discipline is a form of self-care.",
  "You didn't come this far to only come this far.","Consistency beats intensity.","Feed your body, fuel your goals.",
  "One good day at a time."
];
const quote = (mini) => mini ? '' : `<p class="quote">“${QUOTES[Math.floor(Math.random()*QUOTES.length)]}”</p>`;
const LOGO = `<svg class="logo" viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="1.5" y="1.5" width="29" height="29" rx="9" stroke="currentColor" stroke-width="1.5"/><path d="M10 21.5c0-6.2 4.1-10 12-10 0 7.6-3.9 11.6-9.4 11.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M10 22c3-3.2 5.4-5.2 8.6-7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`;

/* botanical line-art watermark (generated once per theme) */
function botanical(color, flip){
  const leaf=(x,y,a,sc)=>`<g transform="translate(${x} ${y}) rotate(${a}) scale(${sc})"><path d="M0 0C28 -34 78 -34 112 0C78 34 28 34 0 0Z"/><path d="M6 0C40 -3 74 -3 104 0" /></g>`;
  let g=`<path d="M200 760C188 600 236 470 196 320C172 230 190 130 214 30"/>`, y=700, a=-38, sc=1;
  for(let i=0;i<9;i++){ const x=200+(i%2?-6:6)*(i/2); g+=leaf(x,y,i%2?180+(-a)-6:a,sc*(1-i*.07)); g+=leaf(x,y-28,i%2?a:180-a-6,sc*(1-i*.07)*.82); y-=68; }
  g+=`<path d="M214 30C226 12 240 6 252 8C246 24 234 34 214 30Z"/>`;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 780"><g fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" ${flip?'transform="translate(420 0) scale(-1 1)"':''}>${g}</g></svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
}
function applyWatermark(){ const c=S.theme==='dark'?'#D9CFC6':'#5B4D45', st=document.documentElement.style; st.setProperty('--wm1',botanical(c,false)); st.setProperty('--wm2',botanical(c,true)); }

/* ---------- state ---------- */
const KEY = 'prettyplan.v1';
const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const INTENS = ['Low','Moderate','High'];
const newEx = () => ({name:'',min:0,kcal:0,int:'Moderate',video:'',url:'',notes:'',done:false});

const LEGS_DAYS=['Monday','Wednesday','Friday'];
function seedWorkDay(weekday){ // sample plan: rest on Sunday, legs Mon/Wed/Fri, abs Tue/Thu/Sat
  if(weekday==='Sunday') return {name:weekday,notes:'Rest day — stretch and relax',exercises:[]};
  const ex=(name,min,kcal,int)=>({name,min,kcal,int,video:'',url:'',notes:'',done:false});
  const base=[ex('Treadmill',30,250,'Moderate')];
  base.push(LEGS_DAYS.includes(weekday)?ex('Glutes & legs',25,180,'High'):ex('Abs & core',15,90,'Moderate'));
  return {name:weekday,notes:'',exercises:base};
}
function seed(){
  return {
    theme:'light',
    ui:{tab:'dashboard',nw:0,nd:0,ww:0,wd:0,dashWeek:'all',vidFilter:'all',adminTab:'nutrition'},
    profile:{name:'',weight:'',height:'',gender:'Female',birthday:'',photo:''},
    nutriDone:{}, planStart:'', nutritionPlanVersion:PLAN.version,
    workouts:{weeks:Array.from({length:4},(_,w)=>({days:DAYS.map((_,i)=>seedWorkDay(PLAN_DAYS[w*7+i].weekday))}))}, workoutsAligned:true,
    videos:[
      {name:'20 min HIIT fat burn',url:'https://www.youtube.com/results?search_query=20+min+hiit+workout',type:'HIIT',notes:''},
      {name:'Glute workout at home',url:'https://www.youtube.com/results?search_query=glute+workout+at+home',type:'Muscles',notes:''},
    ]
  };
}
const PLAN_KEY = KEY+'.plan';   // admin-edited copy of the nutrition plan (falls back to the PDF import)
function loadPlan(){
  try{ const o=JSON.parse(localStorage.getItem(PLAN_KEY));
    if(o&&o.weeks&&o.weeks.length===4&&o.weeks.every(w=>w.days&&w.days.length===7&&w.days.every(d=>Array.isArray(d.meals)&&d.coffee&&Array.isArray(d.coffee.items)))) return o; }catch(e){}
  return JSON.parse(JSON.stringify(window.NUTRITION_PLAN));
}
const PLAN = loadPlan();
const savePlan = () => { try{ localStorage.setItem(PLAN_KEY, JSON.stringify(PLAN)); }catch(e){ alert('Storage is full.'); } };
const PLAN_DAYS = PLAN.weeks.flatMap(w=>w.days);
const entryIds = () => new Set(PLAN_DAYS.flatMap(d=>[...d.meals,d.coffee].map(e=>e.id)));
const NUT = [{k:'kcal',label:'Calories',short:'kcal',unit:'kcal'},{k:'p',label:'Protein',short:'P',unit:'g'},{k:'c',label:'Carbohydrates',short:'C',unit:'g'},{k:'f',label:'Fats',short:'F',unit:'g'},{k:'fiber',label:'Fiber',short:'Fi',unit:'g'}];
function migrate(o){
  const b = seed();
  if(o.nutrition){ // old sample nutrition data is replaced by the PDF plan (kept once as a backup key)
    try{ if(!localStorage.getItem(KEY+'.old-sample-nutrition')) localStorage.setItem(KEY+'.old-sample-nutrition', JSON.stringify(o.nutrition)); }catch(e){}
    delete o.nutrition;
  }
  for(const k of ['theme','profile','workouts','videos']) if(o[k]===undefined) o[k]=b[k];
  o.ui = Object.assign({}, b.ui, o.ui);
  o.ui.nw = Math.min(3, Math.max(0, +o.ui.nw||0)); o.ui.nd = Math.min(6, Math.max(0, +o.ui.nd||0));
  if(!['dashboard','nutrition','workouts','admin','profile'].includes(o.ui.tab)) o.ui.tab='dashboard';
  o.nutriDone = (o.nutriDone && typeof o.nutriDone==='object') ? o.nutriDone : {};
  const ids=entryIds(); Object.keys(o.nutriDone).forEach(k=>{ if(!ids.has(k) || !o.nutriDone[k]) delete o.nutriDone[k]; });
  if(!o.workouts || !Array.isArray(o.workouts.weeks)) o.workouts = b.workouts;
  while(o.workouts.weeks.length<4) o.workouts.weeks.push({days:[]});
  o.workouts.weeks.forEach((wk,wi)=>{ if(!Array.isArray(wk.days)) wk.days=[];
    while(wk.days.length<7) wk.days.push({name:DAYS[wk.days.length],notes:'',exercises:[]});
    wk.days.forEach(d=>{ d.notes=d.notes||''; if(!Array.isArray(d.exercises)) d.exercises=[];
      d.exercises.forEach(e=>{ if(e.int==='Medium') e.int='Moderate'; if(!INTENS.includes(e.int)) e.int='Moderate'; e.url=e.url||''; e.notes=e.notes||''; e.video=e.video??''; }); }); });
  if(!o.workoutsAligned){ // sample workouts were laid out Mon..Sun; re-seat untouched sample days on the plan's weekdays (user-edited days are never replaced)
    const norm=d=>JSON.stringify([d.notes||'',d.exercises.map(e=>[e.name,+e.min,+e.kcal,e.int,e.video??'',!!e.done,e.url||'',e.notes||''])]);
    o.workouts.weeks.slice(0,4).forEach((wk,w)=>wk.days.slice(0,7).forEach((d,i)=>{
      if(norm(d)===norm(seedWorkDay(DAYS[i]))) wk.days[i]=seedWorkDay(PLAN_DAYS[w*7+i].weekday); }));
    o.workoutsAligned=true;
  }
  o.planStart = o.planStart || '';
  o.nutritionPlanVersion = PLAN.version;
  return o;
}

const rootOf = p => p.startsWith('plan.') ? {plan:PLAN} : S;   // 'plan.*' paths edit the nutrition plan
const get = p => p.split('.').reduce((o,k)=>o?.[k], rootOf(p));
const set = (p,v) => { const ks=p.split('.'); const last=ks.pop(); ks.reduce((o,k)=>o[k],rootOf(p))[last]=v; };

/* ---------- compute ---------- */
const _et = new Map();
function entryTot(e){ // totals from the imported food items; null values are "unavailable", not 0
  if(_et.has(e.id)) return _et.get(e.id);
  const t={kcal:0,p:0,c:0,f:0,fiber:0}, miss={kcal:0,p:0,c:0,f:0,fiber:0};
  e.items.forEach(i=>NUT.forEach(n=>{ if(i[n.k]==null) miss[n.k]++; else t[n.k]+=i[n.k]; }));
  const r={t,miss}; _et.set(e.id,r); return r;
}
function dayCalc(day){
  const entries=[...day.meals, day.coffee];
  const planned={kcal:0,p:0,c:0,f:0,fiber:0}, consumed={...planned}, missing={...planned};
  let done=0, mealsDone=0;
  entries.forEach(e=>{ const x=entryTot(e), d=!!S.nutriDone[e.id]; if(d){done++; if(e!==day.coffee) mealsDone++;}
    NUT.forEach(n=>{ planned[n.k]+=x.t[n.k]; missing[n.k]+=x.miss[n.k]; if(d) consumed[n.k]+=x.t[n.k]; }); });
  const remaining={}; NUT.forEach(n=>{ planned[n.k]=r1(planned[n.k]); consumed[n.k]=r1(consumed[n.k]); remaining[n.k]=r1(planned[n.k]-consumed[n.k]); });
  return {planned,consumed,remaining,missing,done,total:entries.length,mealsDone,mealsTotal:day.meals.length};
}
function todayIndex(){
  if(S.planStart){ const d=Math.floor((new Date().setHours(0,0,0,0)-new Date(S.planStart+'T00:00:00'))/864e5); return Math.min(27,Math.max(0,d)); }
  const i=PLAN_DAYS.findIndex(d=>{const c=dayCalc(d);return c.done<c.total}); return i<0?27:i;
}
function dayWork(d){
  const ex=d.exercises; const dn=ex.filter(e=>e.done);
  return {done:dn.length,total:ex.length,min:dn.reduce((a,e)=>a+(+e.min||0),0),kcal:dn.reduce((a,e)=>a+(+e.kcal||0),0),
          pmin:ex.reduce((a,e)=>a+(+e.min||0),0),pkcal:ex.reduce((a,e)=>a+(+e.kcal||0),0)};
}
const pct = (a,b) => b>0 ? Math.min(100,Math.round(a/b*100)) : 0;
const barHtml = (a,b) => `<div class="bar ${pct(a,b)>=100?'ok':''}"><i style="width:${pct(a,b)}%"></i></div>`;

const inp = (path,type='text',ph='') => type==='check'

}

  <div class="card"><label>Workout notes for this day<textarea data-b="${base}.notes" data-t="text">${esc(day.notes)}</textarea></label></div>`;
}

const VTYPES=['HIIT','Muscles','Cardio','Abs','Glutes','Yoga','Stretching','Dance','Other'];
function adminVideos(){
  const f=S.ui.vidFilter;
  return `<div class="tabs"><span class="lbl">Type</span>`+['all',...VTYPES].map(t=>`<button class="${f===t?'on':''}" data-act="ui" data-k="vidFilter" data-v="${t}">${t==='all'?'All':t}</button>`).join('')+`</div>
  <div class="card">${S.videos.map((v,i)=>({v,i})).filter(o=>f==='all'||o.v.type===f).map(({v,i})=>`
    <div class="vid"><label>Name${inp(`videos.${i}.name`)}</label><label>YouTube link${inp(`videos.${i}.url`,'url','https://youtube.com/…')}</label>
    <label>Type<select data-b="videos.${i}.type" data-t="text">${VTYPES.map(t=>`<option ${v.type===t?'selected':''}>${t}</option>`).join('')}</select></label>
    <label>Notes${inp(`videos.${i}.notes`)}</label>
    <div class="row">${safeUrl(v.url)?`<a href="${esc(v.url)}" target="_blank" rel="noopener"><button class="small">Watch</button></a>`:''}${btn('del','videos','×','x','data-i="'+i+'" aria-label="Delete video"')}</div></div>`).join('')||'<p class="na">No videos yet.</p>'}
    <p style="margin:12px 0 0">${btn('add','videos','Add video','small ghost','data-tpl="video"')}</p></div>`;
}

const initialsOf = n => (String(n||'').trim().split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0].toUpperCase()).join(''));
const USER_ICON = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c.6-3.6 3.4-5.5 7-5.5s6.4 1.9 7 5.5"/></svg>`;
function vProfile(){
  const p=S.profile; let age='',bmi='';
  if(p.birthday){ const b=new Date(p.birthday); if(!isNaN(b)) age=Math.floor((Date.now()-b)/31557600000)+' years old'; }
  if(+p.weight>0&&+p.height>0) bmi='BMI '+r1(p.weight/Math.pow(p.height/100,2));
  const ini=initialsOf(p.name);
  return `<h2>Profile</h2><div class="card">
  <div class="profile-top">
    ${p.photo?`<img class="big-avatar" src="${p.photo}" alt="profile">`:`<div class="big-avatar">${esc(ini)||USER_ICON}</div>`}
    <div><label>Profile picture<input type="file" accept="image/*" id="photo"></label>${p.photo?`<p>${btn('rmphoto','','Remove photo','small ghost')}</p>`:''}
    <p>${age?`<span class="pill">${age}</span> `:''}${bmi?`<span class="pill">${bmi}</span>`:''}</p></div></div>
  <div class="grid g2">
    <label>Name${inp('profile.name')}</label>
    <label>Gender<select data-b="profile.gender" data-t="text">${['Female','Male','Other'].map(x=>`<option ${p.gender===x?'selected':''}>${x}</option>`).join('')}</select></label>
    <label>Weight (kg)${inp('profile.weight','number')}</label>
    <label>Height (cm)${inp('profile.height','number')}</label>
    <label>Birthday${inp('profile.birthday','date')}</label>
  </div></div>
  <div class="card"><h3>Backup</h3><div class="row">${btn('export','','Export data','ghost')}<input type="file" id="import" accept=".json" style="display:none"><button class="ghost" onclick="document.getElementById('import').click()">Import data</button>${btn('reset','','Reset everything','ghost')}</div>
  <p style="color:var(--muted);font-size:.8rem;margin-bottom:0">Everything is saved automatically in this browser.</p></div>${quote()}`;
}

function adminNutrition(){
  const w=S.ui.nw, di=S.ui.nd, day=PLAN.weeks[w].days[di], base=`plan.weeks.${w}.days.${di}`;
  const block=(m,mp,isCoffee,mi)=>{ const t=entryTot(m); return `<div class="meal"><div class="meal-h">${inp(mp+'.name')}${isCoffee?'<span class="pill">add-on</span>':btn('del',base+'.meals','Delete meal','small ghost','data-i="'+mi+'"')}</div>
    <div class="scroll"><table class="at"><thead><tr><th>Food</th><th>Quantity</th><th>kcal</th><th>P</th><th>C</th><th>F</th><th>Fiber</th><th></th></tr></thead><tbody>
    ${m.items.map((it,ii)=>{const ip=`${mp}.items.${ii}`; return `<tr><td>${inp(ip+'.name','text','Food')}</td><td>${inp(ip+'.quantity','text','Quantity')}</td>${['kcal','p','c','f','fiber'].map(k=>`<td>${inp(ip+'.'+k,'nnum')}</td>`).join('')}<td>${btn('del',mp+'.items','Delete','small ghost','data-i="'+ii+'" aria-label="Delete food"')}</td></tr>`}).join('')||'<tr><td colspan="8" class="na" style="padding:14px 6px">No foods yet.</td></tr>'}
    </tbody><tfoot><tr><td colspan="2">MEAL TOTAL</td><td>${r1(t.t.kcal)}</td><td>${r1(t.t.p)}</td><td>${r1(t.t.c)}</td><td>${r1(t.t.f)}</td><td>${r1(t.t.fiber)}</td><td></td></tr></tfoot></table></div>
    <p style="margin:10px 0 0">${btn('add',mp+'.items','Add food','small ghost','data-tpl="item"')}</p></div>`; };
  return `<div class="tabs"><span class="lbl">Week</span>${PLAN.weeks.map((x,i)=>`<button class="${w===i?'on':''}" data-act="ui" data-k="nw" data-v="${i}">Week ${i+1}</button>`).join('')}</div>
  <div class="tabs" style="margin-bottom:16px"><span class="lbl">Day</span>${PLAN.weeks[w].days.map((d,i)=>`<button class="${di===i?'on':''}" data-act="ui" data-k="nd" data-v="${i}">Day ${d.dayNumber} <small>${esc(d.weekday.slice(0,3))}</small></button>`).join('')}</div>
  <div class="card"><div class="row"><h3>Day ${day.dayNumber} · ${day.weekday}</h3><span class="spacer"></span>
    <label style="min-width:160px">Carb day type<select data-b="${base}.carbType" data-t="text">${['Low','Moderate','High'].map(x=>`<option ${day.carbType===x?'selected':''}>${x}</option>`).join('')}</select></label></div>
    <p class="na" style="margin:8px 0 0">Leave a nutrient blank to show n/a. Edits appear immediately in the Nutrition and Dashboard views.</p></div>
  ${day.meals.map((m,mi)=>block(m,`${base}.meals.${mi}`,false,mi)).join('')}
  <p style="margin:0 0 16px">${btn('add',base+'.meals','Add meal','small ghost','data-tpl="meal"')}</p>
  ${block(day.coffee,`${base}.coffee`,true,0)}
  <div class="card"><div class="row"><h3>Restore original plan</h3><span class="spacer"></span>${btn('resetplan','','Restore PDF plan','small ghost')}</div><p class="na" style="margin:8px 0 0">Discards every nutrition edit and reloads the imported PDF plan. Workouts, videos and your progress are not affected.</p></div>`;
}
function vAdmin(){
  const sec=S.ui.adminTab||'nutrition';
  return `<h2>Admin</h2><div class="tabs"><span class="lbl">Manage</span>${[['nutrition','Nutrition'],['workouts','Workouts'],['videos','Videos']].map(([k,l])=>`<button class="${sec===k?'on':''}" data-act="ui" data-k="adminTab" data-v="${k}">${l}</button>`).join('')}</div>`
    +(sec==='workouts'?adminWorkouts():sec==='videos'?adminVideos():adminNutrition());
}

const TABS=[['dashboard','Dashboard',vDashboard],['nutrition','Nutrition',vNutrition],['workouts','Workouts',vWorkouts],['admin','Admin',vAdmin],['profile','Profile',vProfile]];
const MAIN_TABS=['dashboard','nutrition','workouts'];

function render(){
  document.documentElement.dataset.theme=S.theme; applyWatermark();
  const view=TABS.find(t=>t[0]===S.ui.tab)||TABS[0];
  const p=S.profile, ini=initialsOf(p.name);
  $('#app').innerHTML=`<header class="top"><div class="brand">${LOGO}<span>Pretty Plan</span></div>
    <nav aria-label="Pages">${TABS.filter(t=>MAIN_TABS.includes(t[0])).map(t=>`<button class="${t[0]===S.ui.tab?'on':''}" data-act="ui" data-k="tab" data-v="${t[0]}">${t[1]}</button>`).join('')}</nav>
    <div class="top-actions"><button class="ghost small" data-act="theme">${S.theme==='dark'?'Light':'Dark'}</button>
    <div class="menu-wrap"><button class="avatar-btn ${['profile','admin'].includes(S.ui.tab)?'on':''}" data-act="menu" aria-haspopup="menu" aria-expanded="${menuOpen}" title="Account" aria-label="Account menu">${p.photo?`<img src="${p.photo}" alt="">`:(ini?esc(ini):USER_ICON)}</button>
    ${menuOpen?`<div class="menu" role="menu"><button role="menuitem" class="${S.ui.tab==='profile'?'on':''}" data-act="ui" data-k="tab" data-v="profile">Profile</button><button role="menuitem" class="${S.ui.tab==='admin'?'on':''}" data-act="ui" data-k="tab" data-v="admin">Admin</button></div>`:''}</div></div></header>
    <main>${view[2]()}</main>`;
  const ph=$('#photo'); if(ph) ph.onchange=onPhoto;
  const im=$('#import'); if(im) im.onchange=onImport;
}

/* ---------- events ---------- */
document.addEventListener('change', e=>{
  const el=e.target; if(!el.dataset.b) return;
  let v = el.dataset.t==='check' ? el.checked : el.dataset.t==='number' ? (parseFloat(el.value)||0) : el.dataset.t==='nnum' ? (el.value===''?null:parseFloat(el.value)) : el.value;
  if(el.dataset.b.startsWith('nutriDone.')){ const id=el.dataset.b.slice(10); if(v) S.nutriDone[id]=true; else delete S.nutriDone[id]; }
  else set(el.dataset.b, v);
  if(el.dataset.b.startsWith('plan.')){ savePlan(); _et.clear(); }
  save();
  const sc=window.scrollY; render(); window.scrollTo(0,sc);
});
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const TPL={ex:newEx,video:()=>({name:'',url:'',type:'HIIT',notes:''}),
  item:()=>({id:'i'+uid(),name:'',quantity:'',grams:null,kcal:0,p:0,c:0,f:0,fiber:0}),
  meal:()=>({id:'m'+uid(),key:'custom',name:'New meal',items:[],pdfTotal:{kcal:null,p:null,c:null,f:null,fiber:null}})};
let menuOpen=false;
document.addEventListener('click', e=>{ if(menuOpen && !e.target.closest('.menu-wrap')){ menuOpen=false; render(); } });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && menuOpen){ menuOpen=false; render(); } });
document.addEventListener('click', e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const d=b.dataset, a=d.act; const sc=window.scrollY;
  if(a==='menu'){ menuOpen=!menuOpen; render(); return; }
  menuOpen=false;
  if(a==='ui'){ S.ui[d.k]=isNaN(d.v)||d.k==='vidFilter'||d.k==='tab'?d.v:+d.v; if(d.k==='tab') S.ui.dashWeek=S.ui.dashWeek; }
  else if(a==='gotoday'){ S.ui.tab='nutrition'; S.ui.nw=+d.w; S.ui.nd=+d.d; }
  else if(a==='theme') S.theme=S.theme==='dark'?'light':'dark';
  else if(a==='add') get(d.path).push(TPL[d.tpl]());
  else if(a==='del'){ if(!confirm('Remove this?')) return; const gone=get(d.path).splice(+d.i,1)[0];
    if(gone&&gone.id) delete S.nutriDone[gone.id];                       // removed meal: drop its completion flag
    if(d.path==='videos') S.workouts.weeks.forEach(wk=>wk.days.forEach(dy=>dy.exercises.forEach(x=>{ if(x.video!==''&&x.video!=null){ if(+x.video===+d.i) x.video=''; else if(+x.video>+d.i) x.video=+x.video-1; } }))); }
  else if(a==='resetplan'){ if(!confirm('Discard all nutrition edits and restore the PDF plan?')) return; try{localStorage.removeItem(PLAN_KEY);}catch(x){} save(); location.reload(); return; }
  else if(a==='gotowork'){ S.ui.ww=+d.w; S.ui.wd=+d.d; }
  else if(a==='rmphoto') S.profile.photo='';
  else if(a==='export'){ const bl=new Blob([JSON.stringify(S)],{type:'application/json'}); const l=document.createElement('a'); l.href=URL.createObjectURL(bl); l.download='pretty-plan-backup.json'; l.click(); return; }
  else if(a==='reset'){ if(!confirm('Erase ALL data and start over?')) return; S=migrate(seed()); }
  if((d.path||'').startsWith('plan.')){ savePlan(); _et.clear(); }
  save(); render(); window.scrollTo(0,sc);
});

function onPhoto(e){
  const f=e.target.files[0]; if(!f) return;
  const img=new Image(), rd=new FileReader();
  rd.onload=()=>{ img.onload=()=>{ const c=document.createElement('canvas'), s=300, r=Math.min(img.width,img.height);
      c.width=c.height=s; c.getContext('2d').drawImage(img,(img.width-r)/2,(img.height-r)/2,r,r,0,0,s,s);
      S.profile.photo=c.toDataURL('image/jpeg',.85); save(); render(); };
    img.src=rd.result; };
  rd.readAsDataURL(f);
}
function onImport(e){
  const f=e.target.files[0]; if(!f) return; const rd=new FileReader();
  rd.onload=()=>{ try{ const o=JSON.parse(rd.result); if(!o.workouts||!o.profile) throw 0; S=migrate(o); save(); render(); }catch(x){ alert('That file is not a valid backup.'); } };
  rd.readAsText(f);
}

window.__app={get S(){return S},PLAN,PLAN_DAYS,dayCalc,render,save};
render();
</script>
</body>
</html>
